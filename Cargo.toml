[workspace]
resolver = "2"
members = ["crates/pharos-core", "crates/pharosd", "crates/pharos-beacon"]

[workspace.package]
version = "0.1.12"
edition = "2021"
license = "MIT"
authors = ["Markus Barta"]
repository = "https://github.com/markus-barta/pharos"

[workspace.dependencies]
pharos-core = { path = "crates/pharos-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Janus crates (token issuance/rotation) are wired in PHAROS-8, not the scaffold:
# janus-warden = { git = "https://github.com/markus-barta/janus" }
# janus-forge  = { git = "https://github.com/markus-barta/janus" }
