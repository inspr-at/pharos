name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: dependency audit
        run: cargo deny check
      - name: shell syntax
        run: bash -n scripts/install-pharos-beacon-systemd.sh
      - name: self-host compose syntax
        run: |
          PHAROS_OIDC_ISSUER=https://issuer.example \
          PHAROS_OIDC_CLIENT_ID=pharos \
          PHAROS_OIDC_REDIRECT_URI=https://pharos.example/auth/callback \
          PHAROS_ALLOWED_OPERATORS=alice \
          PHAROS_REGISTRATION_TOKEN=placeholder \
          docker compose -f docker-compose.selfhost.yml config >/dev/null
      - name: build
        run: cargo build --all --locked
      - name: test
        run: cargo test --all --locked
