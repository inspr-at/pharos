name: DCO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing audited Node 24 pin
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every contribution commit
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-dco.py "$DCO_BASE" "$DCO_HEAD"

  dco-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing audited Node 24 pin
        with:
          persist-credentials: false
      - name: Test signed and unsigned Git histories
        run: python3 -m unittest discover -s tests -p test_dco.py -v
