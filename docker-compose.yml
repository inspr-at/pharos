# Local-only Pharos topology for development smoke tests.
#
# Do not copy this file to production; docker-compose.selfhost.yml is the
# production template.
#
# Secrets are intentionally not committed here. Every report needs a beacon
# token: register the host first (see RUNBOOK.md), then pass the token to the
# beacon profile as PHAROS_TOKEN.

name: pharos-local

services:
  pharosd:
    build: .
    image: pharosd:local
    container_name: pharosd-local
    restart: unless-stopped
    environment:
      PHAROS_ADDR: 0.0.0.0:8080
      PHAROS_PUBLIC_ADDR: 127.0.0.1:8080
      PHAROS_ALLOW_OPEN: "true"
      RUST_LOG: info
      PHAROS_DB: /data/pharos.json
      # Optional: mount a local manifest directory and set, for example:
      # PHAROS_MANIFEST_PATHS: /manifests/host-a.json
      # OIDC/operator policy is intentionally off. Open mode is explicitly
      # limited to the loopback-only published port above.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pharos_data:/data
      # Optional local manifest fixture mount:
      # - ./manifests:/manifests:ro

  pharos-beacon:
    build: .
    image: pharosd:local
    container_name: pharos-beacon-local
    profiles: ["beacon"]
    restart: unless-stopped
    depends_on:
      - pharosd
    entrypoint: ["/usr/local/bin/pharos-beacon"]
    environment:
      PHAROS_URL: http://pharosd:8080
      PHAROS_INTERVAL: 60
      PHAROS_HOSTNAME: ${PHAROS_HOSTNAME:-local-dev}
      PHAROS_ROLE: ${PHAROS_ROLE:-local}
      # Without a token every report gets 401. A private override can instead
      # mount a token file and set PHAROS_TOKEN_FILE to its container path.
      PHAROS_TOKEN: ${PHAROS_TOKEN:-}

volumes:
  pharos_data: {}
