[package]
name = "pharosd"
description = "Pharos server — host registry, API, and dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pharos-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = "0.10"
url = "2"
# OIDC (Authorization Code + PKCE) against Zitadel (PHAROS-4). Default features
# pull reqwest + rustls (ring), so no system OpenSSL — but ring needs a C
# compiler, hence the non-slim build stage in the Dockerfile.
openidconnect = "4"
