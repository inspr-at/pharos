[package]
name = "pharosd"
description = "Pharos server — host registry, API, and dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
paimos-compression-test = [
    "reqwest/brotli",
    "reqwest/deflate",
    "reqwest/gzip",
    "reqwest/zstd",
]

[dependencies]
pharos-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = "0.10"
getrandom = "0.2"
base64 = "=0.22.1"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
# OIDC (Authorization Code + PKCE) against Zitadel (PHAROS-4). Default features
# pull reqwest + rustls (ring), so no system OpenSSL — but ring needs a C
# compiler, hence the non-slim build stage in the Dockerfile.
openidconnect = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-compression = { version = "0.4", default-features = false, features = ["brotli", "deflate", "gzip", "tokio", "zstd"] }
rand = "=0.8.6"
rsa = { version = "=0.9.10", features = ["sha2"] }
tokio = { workspace = true, features = ["io-util"] }
