function wholeGrace(grace){

function cadenceBounds(interval,grace){

function heartbeatTimelineX(age,interval,grace){

  const kept=[];

    kept.push(stamp);

function historyInfo(beats,index,interval,grace,now){

function gapInfo(gap,interval,grace){

function historyEventRank(level){

  if(candidate.stamp!==current.stamp)return candidate.stamp<current.stamp;

function aggregateHistory(samples,windowDef,now,interval,grace){
  const kept=dedupeHeartbeats(samples);
  const end=Number(now);

  const start=end-windowSecs;

function signalInfo(beats,last,interval,now,windowDef=signalWindow,grace){
  const bounds=cadenceBounds(interval,grace);
  const windowLabel=windowDef?.label||'window';
  const windowSecs=Math.max(bounds.cadence,Number(windowDef?.secs)||bounds.cadence);
  const samples=dedupeHeartbeats([].concat(beats||[],Number.isFinite(Number(last))&&Number(last)>0?[Number(last)]:[]));
  const base='Heartbeat delivery over '+windowLabel+': ';
  const uptime=' Not measured host or service uptime.';
  if(!samples.length)return {text:'—',level:'wait',window:windowLabel,kind:'delivery',title:base+'no reports yet.'+uptime,coverage:'none'};
  const requestedStart=Number(now)-windowSecs;
  const future=samples.filter(stamp=>stamp>Number(now)+CLOCK_SKEW_SECS);
  const usable=samples.filter(stamp=>stamp<=Number(now)+CLOCK_SKEW_SECS);
  if(!usable.length)return {text:'—',level:'wait',window:windowLabel,kind:'delivery',title:base+'reports are ahead of Pharos and were not counted.'+uptime,coverage:'none'};
  const retainedStart=Math.max(requestedStart,usable[0]);
  const span=Math.max(bounds.cadence,Math.min(windowSecs,Number(now)-retainedStart));
  const expected=Math.max(1,Math.ceil(span/bounds.cadence));
  const received=usable.filter(stamp=>stamp>=retainedStart&&stamp<=Number(now)).length;
  let longest=0;
  let previous=retainedStart;
  for(const stamp of usable){
    if(stamp<retainedStart||stamp>Number(now))continue;
    longest=Math.max(longest,stamp-previous);
    previous=stamp;
  }
  longest=Math.max(longest,Number(now)-previous);
  const percent=Math.max(0,Math.min(100,Math.round((received/expected)*100)));
  const level=percent>=95?'good':percent>=75?'warn':'down';

}
function arrivalPresentation(last,interval,grace,now){

function backupLevelKey(value){return String(value||'').trim().toLowerCase().replace(/_/g,'-')}

  if(raw==null||raw==='')return null;
  const count=Number(raw);
  return Number.isFinite(count)?count:null;
}
function qualifyingSelectiveRestore(restore){

function backupAgeText(at,now){
  const stamp=Number(at);
  const current=Number(now);
  if(!Number.isFinite(stamp)||!Number.isFinite(current))return 'time unknown';

function projectDailyJob(job,now){

  if(backupLevelKey(job.configured)==='disabled'&&state!=='failed'&&state!=='missing'&&state!=='stale'&&state!=='warning'){
    return {tone:'amber',state:'disabled',label:'Disabled',detail:'Backup is disabled and is not an exemption from backup policy',at:hasSuccess?at:null};
  }
  if(state==='healthy'&&!hasSuccess)return {tone:'neutral',state:'unknown',label:'Success time unknown',detail:'No successful-run time was recorded',at:null};

function dailyProjectedRank(fact){
  const rank=DAILY_FACT_RANK[fact?.state];

}
function projectDailyBackup(observations,now){
  const jobs=(Array.isArray(observations)?observations:[]).filter(job=>job&&typeof job==='object');
  if(!jobs.length)return {tone:'neutral',state:'unknown',label:'Not observed',detail:'No backup signal yet',at:null};
  let worst=null;
  let worstRank=DAILY_FACT_RANK['not-required']+1;
  for(const job of jobs){
    const fact=projectDailyJob(job,now);
    const rank=dailyProjectedRank(fact);
    if(!worst||rank<worstRank){
      worst=fact;
      worstRank=rank;
    }
  }
  return worst;

function projectRestoreStatus(observations,now){
  const jobs=(Array.isArray(observations)?observations:[]).filter(job=>job&&typeof job==='object');
  if(projectDailyBackup(jobs,now).state==='not-required')return {tone:'neutral',state:'not-required',label:'Not required',detail:'No selective restore is required',at:null,overdue:false,producer:''};
  const current=Number(now);
  let passed=null;
  let latestAt=null;
  let latestFailed=false;
  let latestAdverse=false;
  let sawRestore=false;
  for(const job of jobs){
    const restore=job?.restore_validation;
    if(backupLevelKey(restore?.level)!=='restore-sample')continue;

    if(at==null)continue;
    const state=backupLevelKey(restore.state);
    const failed=state==='failed';
    const adverse=state!=='passed';
    if(latestAt==null||at>latestAt){
      latestAt=at;
      latestFailed=failed;
      latestAdverse=adverse;
    }else if(at===latestAt){
      if(failed)latestFailed=true;
      if(adverse)latestAdverse=true;

  }
  if(latestFailed&&(!passed||latestAt>passed.at)){
    return {tone:'bad',state:'failed',label:'Failed',detail:agoNote(passed?passed.at:null,current,'last successful selective restore'),at:passed?passed.at:null,overdue:false,producer:'failed'};
  }
  if(!passed){
    return {tone:'neutral',state:'unknown',label:'Not observed',detail:sawRestore?'No successful selective restore is recorded':'No selective restore evidence from the backup source',at:null,overdue:false,producer:''};
  }

}
function projectBackupCheck(observations,now){
  const jobs=Array.isArray(observations)?observations:[];
  let best=null;
  const consider=(state,at,summary)=>{
    const stamp=Number(at);
    const when=Number.isFinite(stamp)&&stamp>0?stamp:null;
    if(!best||(when!=null&&(best.at==null||when>best.at)))best={state:backupLevelKey(state)||'unknown',at:when,summary:String(summary||'')};
  };
  jobs.forEach(job=>{
    const restore=job?.restore_validation;
    const level=backupLevelKey(restore?.level);

  });
  if(!best)jobs.forEach(job=>{if(job?.last_check_state)consider(job.last_check_state,job.last_check_at,'');});

function projectHealth(facts){

  else if(facts?.liveness==='stale')add('amber','Stale heartbeat',facts.lastSeen);

  if(backup&&backup.tone!=='good'&&backup.state!=='not-required')add(backup.tone||'neutral','Backup '+backup.label,backup.at);
  if(check&&check.tone!=='good')add(check.tone||'neutral',check.label,check.at);
  if(restore&&restore.tone!=='good'&&restore.state!=='not-required')add(restore.tone||'neutral','Restore '+restore.label,restore.at);
  let warnings=0;
  let staleServices=0;
  let unknownServices=0;
  (Array.isArray(facts?.services)?facts.services:[]).forEach(service=>{
    const id=String(service?.id||'');
    if(id==='nix-freshness'||id==='appliance-convergence')return;
    const state=backupLevelKey(service?.state);
    if(state==='warning')warnings+=1;
    else if(state==='stale')staleServices+=1;
    else if(state==='unknown')unknownServices+=1;
  });
  if(warnings)add('amber',warnings+' service warning'+(warnings===1?'':'s'),'');
  if(staleServices)add('amber',staleServices+' service stale'+(staleServices===1?'':'s'),'');
  if(unknownServices)add('neutral','Service state unknown','');
  if(facts?.kernelRestart)add('amber','Restart needed','');
  if(facts?.freshness?.level==='warn')add('amber',facts.freshness.label,'');
  if(facts?.freshness?.level==='wait')add('neutral',facts.freshness.label,'');
  const rank={bad:0,amber:1,neutral:2,good:3};
  let tone='good';
  reasons.forEach(reason=>{if((rank[reason.tone]??2)<rank[tone])tone=reason.tone});
  const problems=reasons.filter(reason=>reason.tone!=='good');
  const summary=problems.find(reason=>reason.tone==='bad')?.label||problems.find(reason=>reason.tone==='amber')?.label||problems.find(reason=>reason.tone==='neutral')?.label||'No action needed';
  const down=reasons.some(reason=>reason.label==='Not reporting');
  const labels={bad:down?'Not reporting':'Problem',amber:'Needs attention',neutral:'Unknown',good:'Healthy'};

}

const LEGACY_UI_COOKIES=['pharos_sort','pharos_view','pharos_search','pharos_live_filter','pharos_signal_window'];
const UI_PREFERENCE_TTL_MS=180*24*60*60*1000;
function clearLegacyUiCookies(){
  LEGACY_UI_COOKIES.forEach(name=>{document.cookie=name+'=; path=/; max-age=0; SameSite=Lax'});
}
function preferenceGet(key){
  try{
    const raw=window.localStorage.getItem(key);
    if(!raw)return null;
    const record=JSON.parse(raw);
    if(record&&record.version===1&&Number(record.expiresAt)>Date.now())return record.value;
    window.localStorage.removeItem(key);
  }catch(_){try{window.localStorage.removeItem(key)}catch(_error){}}
  return null;
}
function preferenceSet(key,value){
  try{window.localStorage.setItem(key,JSON.stringify({version:1,value,expiresAt:Date.now()+UI_PREFERENCE_TTL_MS}))}catch(_){}
}
function hostSurfaces(name){return Array.from(document.querySelectorAll('[data-host-surface="runtime"]')).filter(el=>el.dataset.host===name)}
const hostDrawerContext={host:'',trigger:null,base:null,manualDownSuppressed:false};
function hostDrawerLayer(){return document.querySelector('[data-host-drawer-layer]')}
function hostDrawerPanel(){return document.querySelector('[data-host-drawer]')}
function hostDrawerField(selector){return hostDrawerPanel()?.querySelector(selector)}
function hostDrawerOwner(lifecycle,fallback){
  if(lifecycle?.primary_action)return 'Operator';
  const blockers=Array.isArray(lifecycle?.blocked_by)?lifecycle.blocked_by:[];
  if(blockers.includes('host_report'))return 'Host agent';
  if(blockers.length)return 'Recorded dependency';
  return fallback||'No action owner';
}
function hostDrawerNext(lifecycle,fallback){
  if(lifecycle?.primary_action?.label)return String(lifecycle.primary_action.label);
  if(lifecycle?.slot==='prefs_drift'&&Array.isArray(lifecycle.blocked_by)&&lifecycle.blocked_by.includes('host_report'))return 'Wait for the next host report';
  if(lifecycle?.slot==='blocked')return 'Open the blocking workflow';
  if(lifecycle?.slot==='quiet')return 'Review host settings';
  return fallback||'Open the host workspace';
}
function setHostDrawerText(selector,value){const node=hostDrawerField(selector);if(node)node.textContent=value||'Not recorded'}
function hostDrawerSnapshot(surface){
  return {
    accent:surface.dataset.drawerAccent||'#1f7fb5',
    kind:surface.dataset.drawerKind||'server',
    suppress_down:surface.dataset.drawerSuppressDown==='true',
    suppress_backup:surface.dataset.drawerSuppressBackup==='true',
    suppress_nix_freshness:surface.dataset.drawerSuppressNix==='true',
  };
}
function hostDrawerDraft(){
  return {
    accent:hostDrawerField('[data-host-drawer-color]')?.value||'#1f7fb5',
    kind:hostDrawerField('[data-host-drawer-kind]')?.value||'server',
    suppress_down:hostDrawerContext.manualDownSuppressed,
    suppress_backup:hostDrawerField('[data-host-drawer-alert="backup"]')?.checked!==true,
    suppress_nix_freshness:hostDrawerField('[data-host-drawer-alert="nix"]')?.checked!==true,
  };
}
function syncHostDrawerDown(){
  const kind=hostDrawerField('[data-host-drawer-kind]')?.value||'server';
  const down=hostDrawerField('[data-host-drawer-alert="down"]');
  if(!down)return;
  down.disabled=kind==='workstation'||hostDrawerPanel()?.dataset.canManage!=='true';
  down.checked=kind==='workstation'?false:!hostDrawerContext.manualDownSuppressed;
}
function applyHostDrawerDraft(preferences){
  const color=hostDrawerField('[data-host-drawer-color]');
  const kind=hostDrawerField('[data-host-drawer-kind]');
  const backup=hostDrawerField('[data-host-drawer-alert="backup"]');
  const nix=hostDrawerField('[data-host-drawer-alert="nix"]');
  if(color)color.value=preferences.accent;
  if(kind)kind.value=preferences.kind;
  hostDrawerContext.manualDownSuppressed=preferences.suppress_down;
  if(backup)backup.checked=!preferences.suppress_backup;
  if(nix)nix.checked=!preferences.suppress_nix_freshness;
  syncHostDrawerDown();
}
function updateHostDrawerDraftState(){
  const canManage=hostDrawerPanel()?.dataset.canManage==='true';
  const dirty=Boolean(hostDrawerContext.base)&&JSON.stringify(hostDrawerDraft())!==JSON.stringify(hostDrawerContext.base);
  const status=hostDrawerField('[data-host-drawer-draft-status]');
  const discard=hostDrawerField('[data-host-drawer-discard]');
  const review=hostDrawerField('[data-host-drawer-review]');
  if(status){status.dataset.dirty=dirty?'true':'false';status.textContent=dirty?'Local draft ready — no request sent.':'Change a setting to prepare a review.'}
  if(discard)discard.disabled=!canManage||!dirty;
  if(review)review.disabled=!canManage||!dirty;
}
function drawerSummary(health,surface){
  return String(health?.summary||surface?.querySelector?.('[data-health-summary]')?.textContent||'').trim();
}
function drawerFactText(projected,label,note,age){
  if(projected&&projected.label)return projected.label+' · '+String(projected.detail||'');
  const name=String(label||'').trim();
  const detail=String(note||age||'').trim();
  return name?name+(detail?' · '+detail:''):'';
}
function paintDrawerAssurance(protection,health,surface){
  setHostDrawerText('[data-host-drawer-attention]',drawerSummary(health,surface));
  setHostDrawerText('[data-host-drawer-health]',drawerSummary(health,surface));
  setHostDrawerText('[data-host-drawer-backup]',drawerFactText(protection?.daily,surface?.querySelector?.('[data-daily-backup-label]')?.textContent,surface?.querySelector?.('[data-daily-backup-note]')?.textContent,surface?.querySelector?.('[data-daily-backup-age]')?.textContent));
  setHostDrawerText('[data-host-drawer-restore]',drawerFactText(protection?.restore,surface?.querySelector?.('[data-restore-label]')?.textContent,surface?.querySelector?.('[data-restore-note]')?.textContent,surface?.querySelector?.('[data-restore-age]')?.textContent));
}
function reasonLine(label,at,visible){
  const name=String(label||'').replace(/\s+/g,' ').trim();
  const parsed=utcObservedStamp(recordedUnix(at));
  const stamp=String(visible||parsed?.visible||'').trim();
  if(name&&stamp)return name+' · '+stamp;
  return name||stamp||'Not recorded';
}
function reasonFromNode(node){
  const time=node.querySelector?.('[data-health-date]')||node.querySelector?.('time');
  let label=String(node.textContent||'');
  if(time?.textContent)label=label.split(time.textContent).join(' ');
  return reasonLine(label,node.dataset?.healthAt,time?.textContent||'');
}
function paintDrawerMark(surface){
  const mark=hostDrawerField('[data-host-drawer-mark]');
  if(!mark)return;
  if(!mark.dataset.defaultMark)mark.dataset.defaultMark=mark.innerHTML;
  const badge=surface.querySelector('[data-health-badge]')||surface.querySelector('.os-badge');
  if(badge){
    const icon=badge.querySelector?.('.os-badge-icon');
    mark.innerHTML=icon?icon.innerHTML:(badge.innerHTML||'');
    mark.dataset.healthTone=badge.dataset.healthTone||'neutral';
  }else{
    mark.innerHTML=mark.dataset.defaultMark||'';
    delete mark.dataset.healthTone;
  }
  const health=hostDrawerField('[data-host-drawer-health-label]');
  const source=surface.querySelector('[data-health-label]');
  if(health){
    health.textContent=String(source?.textContent||'').trim()||'Not recorded';
    health.dataset.healthTone=source?.dataset.healthTone||badge?.dataset.healthTone||'neutral';
  }
}
function paintDrawerPosture(assurance,surface){
  const title=hostDrawerField('[data-host-drawer-posture-title]');
  if(!title)return;
  const problems=(assurance?.health?.reasons||[]).filter(reason=>reason&&reason.tone&&reason.tone!=='good');
  const tone=assurance?.health?.tone||surface?.querySelector?.('[data-health-block]')?.dataset?.healthTone||surface?.querySelector?.('[data-health-label]')?.dataset?.healthTone||'';
  title.textContent=(problems.length||tone==='amber'||tone==='bad')?'Needs attention':'Current observations';
}
function paintDrawerGrace(surface){
  const node=hostDrawerField('[data-host-drawer-grace]');
  const secs=String(surface?.dataset?.grace||'').trim();
  const source=String(surface?.dataset?.graceSource||'');
  if(node)node.textContent=secs?secs+'s · '+(source==='host'?'host override':'fleet default'):'Not recorded';
  setHostDrawerText('[data-grace-source-line]',String(surface?.dataset?.graceSourceLine||'').trim());
  setHostDrawerText('[data-grace-rule]',String(surface?.dataset?.graceRule||'').trim());
  const pending=hostDrawerField('[data-grace-pending]');
  const pendingText=String(surface?.dataset?.gracePendingLine||'').trim();
  if(pending){
    pending.textContent=pendingText||'Not recorded';
    pending.hidden=!pendingText;
  }
}
function updateOpenHostDrawer(host,now){
  if(!host||host.name!==hostDrawerContext.host)return;
  const lifecycle=host.lifecycle||{};
  setHostDrawerText('[data-host-drawer-state]',String(host.liveness||'unknown').replaceAll('_',' '));
  const state=hostDrawerField('[data-host-drawer-state]');
  if(state)state.dataset.level=String(lifecycle.level||host.liveness||'');
  setHostDrawerText('[data-host-drawer-guidance]',String(lifecycle.detail||'No pending work is waiting.'));
  setHostDrawerText('[data-host-drawer-owner]',hostDrawerOwner(lifecycle,''));
  setHostDrawerText('[data-host-drawer-next]',hostDrawerNext(lifecycle,''));
  setHostDrawerText('[data-host-drawer-settings-state]',String(host.preferences_state||'applied').replaceAll('_',' '));
  const current=Number.isFinite(Number(now))?Number(now):Date.now()/1000;
  const surface=hostSurfaces(host.name)[0]||null;
  const assurance=projectHostAssurance(host,current);
  paintDrawerAssurance(assurance.protection,assurance.health,surface);
  paintDrawerPosture(assurance,surface);
  paintDrawerGrace(surface);
  fillDrawerEvidence(surface,host,current);
}
function drawerClock(at){
  const stamp=utcObservedStamp(recordedUnix(at));
  return stamp?stamp.visible:'Not recorded';
}
function fillDrawerEvidence(surface,host,now){
  const reasons=hostDrawerField('[data-host-drawer-reasons]');
  if(reasons){
    reasons.replaceChildren();
    const live=(host&&projectHostAssurance(host,now).health.reasons||[]).filter(reason=>reason&&reason.tone!=='good');
    const rows=live.length?live.map(reason=>reasonLine(reason.label,reason.at,'')):Array.from(surface?.querySelectorAll?.('[data-health-reason]')||[]).map(reasonFromNode);
    const lines=rows.length?rows:[reasonLine(surface?.querySelector?.('[data-health-summary]')?.textContent,'','')];
    lines.forEach(text=>{
      const item=document.createElement('li');
      item.textContent=text;
      reasons.appendChild(item);
    });
    surface?.querySelectorAll?.('.freshness-rail .fresh-row-compact:not([hidden])').forEach(chip=>{
      const detail=String(chip.dataset.freshDetail||chip.querySelector?.('[data-fresh-value]')?.textContent||'').replace(/\s+/g,' ').trim();
      const label=String(chip.dataset.freshLabel||'').replace(/\s+/g,' ').trim();
      const text=detail?(label&&!detail.toLowerCase().includes(label.toLowerCase())?label+' · '+detail:detail):label;
      if(!text||lines.some(line=>line.toLowerCase().includes(text.toLowerCase())))return;
      lines.push(text);
      const item=document.createElement('li');
      item.textContent=text;
      reasons.appendChild(item);
    });
  }
  const protection=host?projectHostAssurance(host,now).protection:null;
  const backupClock=hostDrawerField('[data-host-drawer-backup-clock]');
  const restoreClock=hostDrawerField('[data-host-drawer-restore-clock]');
  if(backupClock)backupClock.textContent=protection?drawerClock(protection.daily?.at):(surface?.querySelector?.('[data-daily-backup-date]')?.textContent||'not recorded');
  if(restoreClock)restoreClock.textContent=protection?drawerClock(protection.restore?.at):(surface?.querySelector?.('[data-restore-date]')?.textContent||'not recorded');
  const check=protection?.check;
  const checkLabel=surface?.querySelector?.('[data-backup-check-label]')?.textContent||'';
  const checkNote=surface?.querySelector?.('[data-backup-check-note]')?.textContent||'';
  setHostDrawerText('[data-host-drawer-check]',check?(check.label+' · '+check.detail):(checkLabel?checkLabel+(checkNote?' · '+checkNote:''):'Not recorded'));
  const freshness=host?.freshness||null;
  const evidence=freshness?.deployment_evidence||null;
  const nixcfg=freshness?.nixcfg_comparison||null;
  const summary=host?.freshness_tldr||surface?.querySelector?.('[data-config-summary]')?.textContent||'';
  setHostDrawerText('[data-host-drawer-config]',summary||'Not observed');
  setHostDrawerText('[data-host-drawer-deployed]',evidence?shortRevision(evidence.source_revision):(surface?.querySelector?.('[data-deployed-sha]')?.textContent||'Not observed'));
  setHostDrawerText('[data-host-drawer-nixcfg]',nixcfg?shortRevision(nixcfg.upstream_revision):(surface?.querySelector?.('[data-nixcfg-sha]')?.textContent||'Not observed'));
  setHostDrawerText('[data-host-drawer-nixpkgs]',evidence?shortRevision(evidence.nixpkgs_revision):(surface?.querySelector?.('[data-nixpkgs-sha]')?.textContent||'Not observed'));
}
function populateHostDrawer(surface){
  const host=surface.dataset.host||'';
  const trigger=surface.querySelector('[data-host-drawer-trigger]');
  const openHost=fleetHostsByName.get(host)||null;
  const lifecycle=openHost?.lifecycle||null;
  const openedAt=Date.now()/1000;
  const assurance=openHost?projectHostAssurance(openHost,openedAt):null;
  hostDrawerContext.host=host;
  hostDrawerContext.trigger=trigger;
  hostDrawerContext.base=hostDrawerSnapshot(surface);
  setHostDrawerText('[data-host-drawer-title]',host);
  setHostDrawerText('[data-host-drawer-role]',surface.querySelector('.role')?.textContent||'host');
  paintDrawerMark(surface);
  paintDrawerPosture(assurance,surface);
  paintDrawerGrace(surface);
  setHostDrawerText('[data-host-drawer-state]',String(surface.dataset.live||'unknown').replaceAll('_',' '));
  const state=hostDrawerField('[data-host-drawer-state]');
  if(state)state.dataset.level=String(lifecycle?.level||surface.dataset.live||'');
  setHostDrawerText('[data-host-drawer-guidance]',String(lifecycle?.detail||surface.dataset.drawerLifecycleDetail||'No pending work is waiting.'));
  setHostDrawerText('[data-host-drawer-owner]',hostDrawerOwner(lifecycle,surface.dataset.drawerLifecycleOwner));
  setHostDrawerText('[data-host-drawer-next]',hostDrawerNext(lifecycle,surface.dataset.drawerNextAction));
  setHostDrawerText('[data-host-drawer-settings-state]',String(surface.dataset.drawerSettingsState||'applied').replaceAll('_',' '));
  const workspace=hostDrawerField('[data-host-drawer-workspace]');
  if(workspace)workspace.href=surface.dataset.drawerWorkspaceHref||appUrl('/hosts/'+encodeURIComponent(host));
  paintDrawerAssurance(assurance?.protection||null,assurance?.health||null,surface);
  fillDrawerEvidence(surface,openHost,openedAt);
  applyHostDrawerDraft(hostDrawerContext.base);
  updateHostDrawerDraftState();
}
function hostDrawerFocusables(){
  return Array.from(hostDrawerPanel()?.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled])')||[]).filter(node=>!node.hidden&&node.getClientRects().length>0);
}
let beatOwnerSeq=0;
function beatOwnerId(beat){
  if(!beat.dataset.beatOwner){
    beatOwnerSeq+=1;
    beat.dataset.beatOwner='b'+beatOwnerSeq;
  }
  return beat.dataset.beatOwner;
}
function restoreParkedHistory(){
  const slot=hostDrawerField('[data-host-drawer-history]');
  const history=slot?.querySelector?.('.beat-history');
  if(!history)return;
  const owner=history.dataset.historyOwner||'';
  const beat=owner?document.querySelector('.beat[data-beat-owner="'+owner+'"]'):null;
  if(beat&&typeof beat.appendChild==='function')beat.appendChild(history);
}
function ensureHistoryWindowControl(history){
  const label=history?.querySelector?.('[data-history-window-label]');
  if(!label||String(label.tagName||'').toUpperCase()==='BUTTON'||typeof document.createElement!=='function')return;
  const button=document.createElement('button');
  button.type='button';
  button.className='beat-window';
  button.setAttribute('data-signal-window','');
  button.setAttribute('data-history-window-label','');
  button.textContent=label.textContent||'';
  button.title='Change delivery window';
  button.setAttribute('aria-label','Change delivery window; currently '+(label.textContent||''));
  button.addEventListener('click',cycleSignalWindow);
  if(typeof label.replaceWith==='function')label.replaceWith(button);
}
function parkHeartbeatHistory(surface){
  restoreParkedHistory();
  const beat=surface?.querySelector?.('.beat');
  const history=beat?.querySelector?.('.beat-history');
  const slot=hostDrawerField('[data-host-drawer-history]');
  if(!slot||typeof slot.appendChild!=='function')return;
  if(!history){
    if(!slot.querySelector('.beat-history'))slot.textContent='Not recorded';
    return;
  }
  slot.textContent='';
  history.dataset.historyOwner=beatOwnerId(beat);
  history.dataset.historyHost=surface.dataset.host||'';
  slot.appendChild(history);
  ensureHistoryWindowControl(history);
}
function lockDrawerScroll(){
  const gap=Math.max(0,window.innerWidth-document.documentElement.clientWidth);
  document.body.style.paddingRight=gap?gap+'px':'';
}
function unlockDrawerScroll(){
  document.body.style.removeProperty('padding-right');
}
function openHostDrawer(surface){
  const layer=hostDrawerLayer();
  if(!layer||!surface)return;
  closeHostActions(openHostActionsRoot);
  lockDrawerScroll();
  populateHostDrawer(surface);
  parkHeartbeatHistory(surface);
  layer.hidden=false;
  document.body.dataset.hostDrawerOpen='true';
  hostSurfaces(hostDrawerContext.host).forEach(item=>item.querySelector('[data-host-drawer-trigger]')?.setAttribute('aria-expanded','true'));
  requestAnimationFrame(()=>hostDrawerField('.host-drawer-close')?.focus());
}
function closeHostDrawer(restore=true){
  restoreParkedHistory();
  const layer=hostDrawerLayer();
  if(!layer||layer.hidden)return;
  layer.hidden=true;
  document.body.removeAttribute('data-host-drawer-open');
  unlockDrawerScroll();
  hostSurfaces(hostDrawerContext.host).forEach(item=>item.querySelector('[data-host-drawer-trigger]')?.setAttribute('aria-expanded','false'));
  const returnFocus=hostDrawerContext.trigger;
  hostDrawerContext.host='';
  hostDrawerContext.trigger=null;
  hostDrawerContext.base=null;
  hostDrawerContext.manualDownSuppressed=false;
  if(restore&&returnFocus?.isConnected)returnFocus.focus();
}
function reviewHostDrawerDraft(){
  if(!hostDrawerContext.host||!hostDrawerContext.base||hostDrawerPanel()?.dataset.canManage!=='true')return;
  const draft=hostDrawerDraft();
  if(JSON.stringify(draft)===JSON.stringify(hostDrawerContext.base))return;
  const params=new URLSearchParams({
    host:hostDrawerContext.host,
    draft:'fleet-drawer',
    draft_accent:draft.accent,
    draft_kind:draft.kind,
    draft_suppress_down:String(draft.suppress_down),
    draft_suppress_backup:String(draft.suppress_backup),
    draft_suppress_nix:String(draft.suppress_nix_freshness),
  });
  params.delete('host');
  window.location.assign(appUrl('/hosts/'+encodeURIComponent(hostDrawerContext.host)+'?'+params.toString()));
}
function initHostDrawer(){
  if(!hostDrawerLayer())return;
  document.addEventListener('click',event=>{
    const trigger=event.target.closest('[data-host-drawer-trigger]');
    if(trigger){event.preventDefault();openHostDrawer(trigger.closest('[data-host-surface="runtime"]'));return}
    if(event.target.closest('[data-host-drawer-close]')){event.preventDefault();closeHostDrawer()}
  });
  hostDrawerField('[data-host-drawer-discard]')?.addEventListener('click',()=>{if(hostDrawerContext.base){applyHostDrawerDraft(hostDrawerContext.base);updateHostDrawerDraftState()}});
  hostDrawerField('[data-host-drawer-color]')?.addEventListener('input',updateHostDrawerDraftState);
  hostDrawerField('[data-host-drawer-kind]')?.addEventListener('change',()=>{syncHostDrawerDown();updateHostDrawerDraftState()});
  hostDrawerPanel()?.querySelectorAll('[data-host-drawer-alert]').forEach(input=>input.addEventListener('change',()=>{
    if(input.dataset.hostDrawerAlert==='down')hostDrawerContext.manualDownSuppressed=!input.checked;
    updateHostDrawerDraftState();
  }));
  hostDrawerField('[data-host-drawer-draft]')?.addEventListener('submit',event=>{event.preventDefault();reviewHostDrawerDraft()});
  document.addEventListener('keydown',event=>{
    if(hostDrawerLayer()?.hidden!==false)return;
    if(event.key==='Escape'){event.preventDefault();closeHostDrawer();return}
    if(event.key!=='Tab')return;
    const focusable=hostDrawerFocusables();
    if(!focusable.length)return;
    const first=focusable[0];
    const last=focusable[focusable.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  });
}
let openHostActionsRoot=null;
let openHostActionsScrollPosition=null;
let hostActionContext=null;
let hostActionReturnFocus=null;
let fleetHostsByName=new Map();
const hostActionPoll={timer:null,controller:null,id:null,failures:0,lastRevision:'',terminal:false};
function setHostActionPollSuspended(suspended){

function pauseHostActionPoll(){

function stopHostActionPoll(){

function visibleHostActionItems(menu){return Array.from(menu?.querySelectorAll('[role="menuitem"]')||[]).filter(item=>!item.hidden)}
function hostActionsSurface(root){return root?.closest?.('[data-host-surface="runtime"]')||null}
function closeHostActions(root=openHostActionsRoot,restore=false){
  if(!root)return;
  const trigger=root.querySelector('[data-host-actions-trigger]');
  const menu=root.querySelector('[data-host-actions-menu]');
  if(menu){menu.hidden=true;menu.style.removeProperty('position');menu.style.removeProperty('left');menu.style.removeProperty('top')}
  if(trigger)trigger.setAttribute('aria-expanded','false');
  const surface=hostActionsSurface(root);
  if(surface)delete surface.dataset.hostActionsOpen;
  if(openHostActionsRoot===root){openHostActionsRoot=null;openHostActionsScrollPosition=null}
  if(restore)trigger?.focus();
  flushFleetSortAfterInteraction();
}
function positionHostActions(root){
  const trigger=root.querySelector('[data-host-actions-trigger]');
  const menu=root.querySelector('[data-host-actions-menu]');
  if(!trigger||!menu||menu.hidden)return;
  const anchor=trigger.getBoundingClientRect();
  const origin=root.getBoundingClientRect();
  const menuWidth=menu.offsetWidth;
  const menuHeight=menu.offsetHeight;
  const margin=12;
  menu.style.position='absolute';
  // Horizontal: hang the menu from the trigger's right edge (the trigger sits inside the card,
  // inside the viewport), unless that would push its left edge past the viewport margin; then pin
  // it to the margin. Everything is expressed relative to the root's layout box, never from a
  // measured rect of the menu itself, and never with position:fixed (.card has contain:layout,
  // which makes the card the containing block for fixed descendants).
  if(anchor.right-menuWidth>=margin){
    menu.style.left='auto';
    menu.style.right=(origin.right-anchor.right)+'px';
  }else{
    menu.style.right='auto';
    menu.style.left=(margin-origin.left)+'px';
  }
  // Vertical: below the trigger when it fits, else above, else pinned to the top margin.
  const below=anchor.bottom-origin.top+7;
  const above=anchor.top-origin.top-menuHeight-7;
  let top=origin.top+below+menuHeight<=window.innerHeight-margin?below:above;
  if(origin.top+top<margin)top=margin-origin.top;
  if(origin.top+top+menuHeight>window.innerHeight-margin)top=Math.max(margin-origin.top,window.innerHeight-margin-menuHeight-origin.top);
  menu.style.top=top+'px';
}
function openHostActions(root){
  if(openHostActionsRoot&&openHostActionsRoot!==root)closeHostActions(openHostActionsRoot);
  const trigger=root.querySelector('[data-host-actions-trigger]');
  const menu=root.querySelector('[data-host-actions-menu]');
  if(!trigger||!menu)return;
  const opening=menu.hidden;
  if(!opening){closeHostActions(root,true);return}
  menu.hidden=false;
  trigger.setAttribute('aria-expanded','true');
  const surface=hostActionsSurface(root);
  if(surface)surface.dataset.hostActionsOpen='true';
  openHostActionsRoot=root;
  openHostActionsScrollPosition={x:window.scrollX,y:window.scrollY};
  positionHostActions(root);
  visibleHostActionItems(menu)[0]?.focus({preventScroll:true});
}
function closeHostActionsOnScroll(event){
  if(!openHostActionsRoot)return;
  const viewportScroll=event.target===document||event.target===window;
  if(viewportScroll&&openHostActionsScrollPosition&&window.scrollX===openHostActionsScrollPosition.x&&window.scrollY===openHostActionsScrollPosition.y)return;
  closeHostActions(openHostActionsRoot);
}
function setHostActionFact(name,value,visible=true){
  const overlay=document.querySelector('[data-host-action-overlay]');
  const row=overlay?.querySelector('[data-host-action-fact-row="'+name+'"]');
  const target=overlay?.querySelector('[data-host-action-fact="'+name+'"]');
  if(row)row.hidden=!visible;
  if(target)target.textContent=value||'not reported';
}
function hostActionTechnicalText(root){
  const surface=root.closest('[data-host-surface="runtime"]');
  const live=surface?.dataset.live||'unknown';
  const kernel=root.dataset.kernelState==='reboot_required'
    ? root.dataset.kernelRunning+' running; '+root.dataset.kernelExpected+' expected'
    : root.dataset.kernelState.replaceAll('_',' ');
  const lines=[
    'Host: '+root.dataset.host,
    'Role: '+root.dataset.role,
    'System: '+(root.dataset.isNix==='true'?'Nix':'non-Nix'),
    'Live state: '+live.replaceAll('_',' '),
    'Declared: '+(root.dataset.declared==='true'?'yes':'no'),
    'Privileged actions: '+(root.dataset.janusReady==='true'?'Janus guarded':'not prepared'),
    'Settings: '+root.dataset.settingsState.replaceAll('_',' '),
    'Backup: '+root.dataset.backupLabel,
    'Kernel: '+kernel
  ];
  if(root.dataset.deployedRevision)lines.push('Deployed revision: '+root.dataset.deployedRevision);
  if(root.dataset.nixcfgRevision)lines.push('nixcfg revision: '+root.dataset.nixcfgRevision);
  if(root.dataset.nixpkgsRevision)lines.push('nixpkgs revision: '+root.dataset.nixpkgsRevision);
  return lines.join('\n');
}
function closeHostActionDialog(restore=true){
  const overlay=document.querySelector('[data-host-action-overlay]');
  if(!overlay)return;
  stopHostActionPoll();
  if(overlay.hidden)return;
  overlay.hidden=true;
  document.body.removeAttribute('data-host-action-dialog-open');
  resumeBeatClock();
  resumeRefresh('dialog-close');
  const input=overlay.querySelector('[data-host-remove-input]');
  if(input)input.value='';
  const disposition=overlay.querySelector('[data-host-remove-disposition]');
  if(disposition)disposition.value='';
  const successor=overlay.querySelector('[data-host-remove-successor-input]');
  if(successor)successor.value='';
  const attended=overlay.querySelector('[data-host-attended-input]');
  if(attended)attended.checked=false;
  hostActionPoll.lastRevision=null;
  hostActionContext=null;
  if(restore)hostActionReturnFocus?.focus();
  hostActionReturnFocus=null;
}

    infoCopy.textContent='This step only prepares the guarded plan. You confirm again immediately before any live change.';

    if(root.dataset.retired==='true'){
      title.textContent='Removal pending for '+root.dataset.host;
      copy.textContent='Pharos has revoked this host’s reporting access. The server and its data remain untouched while declarative cleanup is reviewed and applied.';
      infoTitle.textContent='Beacon access revoked';
      infoCopy.textContent='The host remains visible so this unfinished removal cannot be mistaken for completion.';
      const dispositionLabel={destroyed:'Host no longer exists',unmanaged:'Host remains unmanaged',rebuilt:'Replaced by '+root.dataset.retirementSuccessor}[root.dataset.retirementDisposition]||'Lifecycle recorded';
      const waitingFor=[];
      if(root.dataset.retirementDeclarationPending==='true')waitingFor.push('nixcfg removal');

    if(needsCleanup){

async function requestHostAction(path,body,extraHeaders={}){
  const response=await fetch(appUrl(path),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Pharos-Action':'1',...extraHeaders},body:JSON.stringify(body||{})});
  const payload=await response.json().catch(()=>({}));
  if(!response.ok&&!payload.job)throw new Error(payload.error||payload.message||'The guarded action could not be requested.');
  return payload;
}
function hostActionFromWorkflowKind(kind){
  if(kind==='update_restart')return 'update-restart';
  if(kind==='remove_host')return 'remove';
  if(kind==='settings_change')return 'settings';
  if(kind==='system_update_proposal')return 'system-update';
  return 'workflow';
}
function hostWorkflowUncertaintyAcknowledged(workflow){
  return Array.isArray(workflow?.events)&&workflow.events.some(event=>String(event.label||'').toLowerCase().includes('uncertainty acknowledged'));
}
function systemUpdateUncertaintyNeedsAcknowledgement(job,workflow){
  return workflow?.kind==='system_update_proposal'
    &&job?.state==='failed'
    &&workflow.status_label==='dispatch outcome uncertain'
    &&!hostWorkflowUncertaintyAcknowledged(workflow);
}
function hostActionStateLabel(state){
  return ({proposal_requested:'review requested',queued_review:'review queued',reviewing:'reviewing on host',awaiting_confirmation:'ready for confirmation',queued_apply:'confirmed',applying:'applying on host',rebooting:'restarting and verifying',removal_pending:'removal pending',succeeded:'completed',failed:'failed',cancelled:'cancelled safely'})[state]||String(state||'recorded').replaceAll('_',' ');
}

function hostActionConfirmationReady(){
  const overlay=document.querySelector('[data-host-action-overlay]');
  const input=overlay?.querySelector('[data-host-remove-input]');
  if(hostActionContext?.action==='remove'){
    const disposition=overlay?.querySelector('[data-host-remove-disposition]')?.value||'';
    const successor=(overlay?.querySelector('[data-host-remove-successor-input]')?.value||'').trim();
    return input?.value===hostActionContext.host
      &&['destroyed','unmanaged','rebuilt'].includes(disposition)
      &&(disposition!=='rebuilt'||(successor.length>0&&successor!==hostActionContext.host));
  }
  const attended=overlay?.querySelector('[data-host-attended-input]');
  return input?.value===hostActionContext?.host&&attended?.checked===true;
}
function scheduleHostActionPoll(id,delay=2000){
  if(hostActionPoll.terminal)return;
  if(hostActionPoll.timer!=null)clearTimeout(hostActionPoll.timer);
  hostActionPoll.timer=null;
  hostActionPoll.id=id;
  const suspended=document.hidden||!navigator.onLine||!hostActionContext;
  setHostActionPollSuspended(suspended);
  if(suspended)return;
  hostActionPoll.timer=setTimeout(()=>{
    hostActionPoll.timer=null;
    pollHostActionJob(id,false);
  },delay);
}
function hostActionPollDelay(job){
  const kind=job?.workflow?.kind;
  if(kind==='settings_change')return 2000;
  if(kind==='remove_host')return 10000;
  return job?.state==='rebooting'?5000:2000;
}
function hostActionWorkflowRevision(job,workflowHtml){
  const workflow=job?.workflow||{};
  const timing=workflow.next_action?.timing||{};
  return JSON.stringify([
    job?.id,job?.state,job?.updated_at,
    workflow.linked_run_id||'',workflow.linked_run_state||'',workflow.linked_run_updated_at||'',
    timing.as_of||'',timing.next_check_at||'',timing.overdue===true,timing.escalation_due===true,
    workflowHtml||''
  ]);
}
function replaceHostWorkflowHtml(root,workflowHtml){
  if(!root)return;
  const advanced=root.querySelector('.host-workflow-advanced');
  const summary=advanced?.querySelector('summary');
  const keepAdvancedOpen=advanced?.open===true;
  const restoreSummaryFocus=document.activeElement===summary;
  root.innerHTML=workflowHtml||'';
  const nextAdvanced=root.querySelector('.host-workflow-advanced');
  if(nextAdvanced&&keepAdvancedOpen)nextAdvanced.open=true;
  if(restoreSummaryFocus)nextAdvanced?.querySelector('summary')?.focus({preventScroll:true});
}
function renderHostActionJob(job,message,workflowHtml){
  if(!hostActionContext||!job)return;
  const overlay=document.querySelector('[data-host-action-overlay]');
  const dialog=overlay?.querySelector('[data-host-action-dialog]');
  const primary=overlay?.querySelector('[data-host-action-primary]');
  const cancel=overlay?.querySelector('.host-action-dialog-buttons [data-host-action-close]');
  const cancelRequest=overlay?.querySelector('[data-host-action-cancel]');
  const status=overlay?.querySelector('[data-host-action-status]');
  const copy=overlay?.querySelector('[data-host-action-copy]');
  const title=overlay?.querySelector('[data-host-action-title]');
  const info=overlay?.querySelector('[data-host-action-info]');
  const facts=overlay?.querySelector('[data-host-action-facts]');
  const workflowRoot=overlay?.querySelector('[data-host-workflow]');
  const safeNote=overlay?.querySelector('[data-host-action-safe-note]');
  const confirm=overlay?.querySelector('[data-host-remove-confirm]');
  const removeName=overlay?.querySelector('[data-host-remove-name]');
  const attended=overlay?.querySelector('[data-host-attended-confirm]');
  const workflow=job.workflow||{};
  const workflowKind=String(workflow.kind||job.kind||'');
  const primaryAction=workflow.primary_action||null;
  const actionRequired=['continue','restart','apply_declared','confirm','retry','recover'].includes(primaryAction?.kind||'');
  hostActionContext.jobId=job.id;
  hostActionContext.actionTargetId=primaryAction?.target_run_id||job.id;
  hostActionContext.workflowHost=job.host||hostActionContext.host;
  hostActionContext.action=hostActionFromWorkflowKind(workflowKind);
  hostActionContext.root.dataset.actionJobId=job.id;
  hostActionContext.root.dataset.actionKind=workflowKind;
  hostActionContext.root.dataset.actionState=job.state;
  hostActionPoll.lastRevision=hostActionWorkflowRevision(job,workflowHtml);
  if(dialog){dialog.dataset.workflow='true';dialog.dataset.action=workflowKind.replaceAll('_','-')}
  dialog?.querySelectorAll('[data-action-icon]').forEach(icon=>{
    const iconKind=workflowKind==='settings_change'?'settings-change':workflowKind==='update_restart'?'update-restart':workflowKind==='remove_host'?'remove':'system-update';
    icon.hidden=icon.dataset.actionIcon!==iconKind;
  });
  if(title)title.textContent=workflow.title||hostActionContext.host+' workflow';
  if(copy)copy.textContent=workflow.guidance||message||hostActionStateLabel(job.state)+'.';
  if(info)info.hidden=true;
  if(facts)facts.hidden=true;
  if(workflowRoot){workflowRoot.hidden=false;replaceHostWorkflowHtml(workflowRoot,workflowHtml)}
  const active=(workflowKind==='update_restart'&&['queued_review','reviewing','queued_apply','applying','rebooting'].includes(job.state))
    ||(workflowKind==='settings_change'&&!['succeeded','failed','cancelled'].includes(job.state))
    ||(workflowKind==='remove_host'&&job.state==='removal_pending');
  hostActionPoll.terminal=!active;
  if(safeNote){
    const liveSettings=workflowKind==='settings_change'&&active&&!actionRequired;
    const contract=actionContract(primaryAction?.kind);
    safeNote.dataset.workflowLive=liveSettings?'true':'false';
    safeNote.textContent=contract?contract.effect
      :primaryAction?.kind==='restart'?'Operator action required'
      :liveSettings?'Watching for recorded host evidence'
      :active?'Persisted and reviewable':'Run complete and saved';
  }
  if(status)status.textContent=message||'';
  if(cancel)cancel.textContent='Close';
  if(cancelRequest){
    cancelRequest.hidden=workflow.can_cancel!==true;
    cancelRequest.disabled=false;
    cancelRequest.textContent='Cancel review — no live change was authorised';
  }
  if(confirm)confirm.hidden=primaryAction?.kind!=='confirm';
  if(attended)attended.hidden=primaryAction?.kind!=='confirm';
  if(removeName)removeName.textContent=hostActionContext.host;
  hostActionContext.stage=primaryAction?.kind||'observe';
  const needsUncertaintyAck=systemUpdateUncertaintyNeedsAcknowledgement(job,workflow);
  hostActionContext.uncertaintyJobId=needsUncertaintyAck?job.id:null;
  if(needsUncertaintyAck&&primary){
    primary.hidden=false;
    primary.classList.remove('danger');
    primary.textContent='I verified nixcfg — request again';
    primary.disabled=false;
    hostActionContext.stage='acknowledge-uncertainty';
  }else if(primaryAction?.kind==='refresh'&&primary){
    primary.hidden=true;
    hostActionContext.stage='refresh';
  }else if(primaryAction&&primary){
    const fleetAction=['apply_declared','confirm','retry'].includes(primaryAction.kind)||(primaryAction.kind==='recover'&&Boolean(primaryAction.target_run_id));
    primary.hidden=false;
    primary.classList.remove('danger');
    primary.textContent=primaryAction.label||'Open next action';
    primary.disabled=fleetAction&&hostActionContext.root.dataset.canManage!=='true'
      ?true
      :primaryAction.kind==='confirm'?!hostActionConfirmationReady():false;
  }else if(primary){
    primary.hidden=true;
  }
  if(active&&!actionRequired)scheduleHostActionPoll(job.id,hostActionPollDelay(job));
  else{
    if(hostActionPoll.timer!=null)clearTimeout(hostActionPoll.timer);
    hostActionPoll.timer=null;
    setHostActionPollSuspended(false);
  }
}
async function pollHostActionJob(id,immediate=false){
  if(!hostActionContext||hostActionContext.jobId&&hostActionContext.jobId!==id)return;
  hostActionPoll.timer=null;
  if(hostActionPoll.terminal)return;
  if(document.hidden||!navigator.onLine){hostActionPoll.id=id;setHostActionPollSuspended(true);return}
  setHostActionPollSuspended(false);
  hostActionPoll.controller?.abort();
  const controller=new AbortController();
  hostActionPoll.controller=controller;
  try{
    const response=await fetch(appUrl('/host-actions/jobs/'+encodeURIComponent(id)),{credentials:'same-origin',cache:'no-store',signal:controller.signal});
    const payload=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(payload.error||'Could not refresh guarded action state.');
    hostActionPoll.failures=0;
    const revision=hostActionWorkflowRevision(payload.job,payload.workflow_html);
    if(immediate||revision!==hostActionPoll.lastRevision)renderHostActionJob(payload.job,payload.message,payload.workflow_html);
    else scheduleHostActionPoll(id,hostActionPollDelay(payload.job));
  }catch(error){
    if(error?.name==='AbortError')return;
    const status=document.querySelector('[data-host-action-status]');
    if(status)status.textContent=error instanceof Error?error.message:'Could not refresh guarded action state.';
    hostActionPoll.failures=Math.min(hostActionPoll.failures+1,4);
    scheduleHostActionPoll(id,Math.min(30000,3000*(2**hostActionPoll.failures)));
  }finally{
    if(hostActionPoll.controller===controller)hostActionPoll.controller=null;
  }
}
async function checkHostActionNow(button){
  if(!hostActionContext?.jobId||hostActionContext.stage!=='refresh')return;
  const status=document.querySelector('[data-host-action-status]');
  button.disabled=true;
  if(status)status.textContent='Checking the saved run for a matching host report…';
  if(hostActionPoll.timer!=null)clearTimeout(hostActionPoll.timer);
  hostActionPoll.timer=null;
  await pollHostActionJob(hostActionContext.jobId,true);
  if(button.isConnected&&hostActionContext?.stage==='refresh')button.disabled=false;
}
async function submitHostAction(){
  if(!hostActionContext)return;
  if(hostActionContext.stage==='loading')return;
  const {action,root,host,workflowHost}=hostActionContext;
  const parentJobId=hostActionContext.jobId;
  const actionTargetId=hostActionContext.actionTargetId||parentJobId;
  const workflowHostName=workflowHost||host;
  const overlay=document.querySelector('[data-host-action-overlay]');
  const primary=overlay?.querySelector('[data-host-action-primary]');
  const status=overlay?.querySelector('[data-host-action-status]');
  if(!primary||!status)return;
  primary.disabled=true;
  status.textContent=action==='settings'&&hostActionContext.stage==='continue'?'Continuing the saved request through nixcfg…'
    :action==='settings'&&hostActionContext.stage==='restart'?'Clearing the incomplete request…'
    :(action==='settings'||action==='remove')&&hostActionContext.stage==='acknowledge'?'Recording the nixcfg verification…'
    :action==='settings'&&hostActionContext.stage==='apply_declared'?'Starting the guarded deployment review…'
    :action==='settings'&&hostActionContext.stage==='confirm'?'Recording attended confirmation for the guarded apply…'
    :action==='settings'&&hostActionContext.stage==='retry'?'Retrying the recorded guarded review…'
    :action==='settings'&&hostActionContext.stage==='recover'&&actionTargetId!==parentJobId?'Queueing guarded recovery checks…'
    :(action==='settings'||action==='remove')&&hostActionContext.stage==='recover'?'Retrying the local save without another repository dispatch…'
    :action==='remove'&&hostActionContext.stage==='retry'?'Queueing credential retirement retry…'
    :action==='remove'?'Recording retirement and revoking reports…'
    :action==='system-update'&&hostActionContext.stage==='acknowledge-uncertainty'?'Recording nixcfg verification and requesting again…'
    :hostActionContext.stage==='recover'?'Queueing target-local recovery checks…'
    :hostActionContext.stage==='confirm'?'Recording attended confirmation…'
    :'Requesting a guarded review…';
  try{
    let result;
    if(action==='system-update'&&hostActionContext.stage==='acknowledge-uncertainty'){
      result=await requestHostAction('/host-actions/system-update',{host:workflowHostName},{
        'X-Pharos-Acknowledge-Uncertainty':hostActionContext.uncertaintyJobId||''
      });
    }else if(action==='system-update')result=await requestHostAction('/host-actions/system-update',{host:workflowHostName});
    else if(action==='update-restart'&&hostActionContext.stage==='confirm')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/confirm',{confirmation:host,attended:true});
    else if(action==='update-restart'&&hostActionContext.stage==='retry')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/retry',{});
    else if(action==='update-restart'&&hostActionContext.stage==='recover')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/recover',{});
    else if(action==='update-restart')result=await requestHostAction('/host-actions/'+encodeURIComponent(host)+'/update-restart/review',{intent:hostActionContext.intent||'update'});
    else if(action==='settings'&&hostActionContext.stage==='apply_declared')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(parentJobId)+'/apply-declared',{});
    else if(action==='settings'&&hostActionContext.stage==='confirm')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(actionTargetId)+'/confirm',{confirmation:host,attended:true});
    else if(action==='settings'&&hostActionContext.stage==='retry')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(actionTargetId)+'/retry',{});
    else if(action==='settings'&&hostActionContext.stage==='recover'&&actionTargetId!==parentJobId)result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(actionTargetId)+'/recover',{});
    else if(action==='settings'&&hostActionContext.stage==='continue')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/continue-settings-dispatch',{});
    else if(action==='settings'&&hostActionContext.stage==='restart')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/withdraw',{});
    else if((action==='settings'||action==='remove')&&hostActionContext.stage==='acknowledge')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/acknowledge-dispatch-uncertainty',{});
    else if((action==='settings'||action==='remove')&&hostActionContext.stage==='recover')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/reconcile-accepted-dispatch',{});
    else if(action==='remove'&&hostActionContext.stage==='retry')result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(hostActionContext.jobId)+'/retry-retirement',{});
    else if(action==='remove'){
      const disposition=overlay.querySelector('[data-host-remove-disposition]')?.value||'';
      const successor=(overlay.querySelector('[data-host-remove-successor-input]')?.value||'').trim();
      result=await requestHostAction('/host-actions/'+encodeURIComponent(host)+'/remove',{confirmation:host,disposition,successor:successor||null});
    }
    else return;
    status.textContent=result.message||'Request recorded.';
    const linkedMutation=action==='settings'&&['confirm','retry','recover'].includes(hostActionContext.stage)&&actionTargetId!==parentJobId;
    if(linkedMutation){hostActionPoll.terminal=false;await pollHostActionJob(parentJobId,true)}
    else if(result?.job)renderHostActionJob(result.job,result.message,result.workflow_html);
    else primary.hidden=true;
  }catch(error){
    status.textContent=error instanceof Error?error.message:'The guarded action could not be requested.';
    primary.disabled=false;
  }
}

async function withdrawSettingsChange(actionItem,root){
  const runId=actionItem.dataset.lifecycleRunId||root.dataset.actionJobId||'';
  if(!runId)return;

  // without a run id avoids a stale GET racing the transition response.
  openHostActionDialog('workflow',root,root.querySelector('[data-host-actions-trigger]'));
  const withdrawalContext=hostActionContext;
  const status=document.querySelector('[data-host-action-status]');
  if(status)status.textContent='Clearing the pending request in Pharos…';
  try{
    const result=await requestHostAction('/host-actions/jobs/'+encodeURIComponent(runId)+'/withdraw',{});
    const menuItem=root.querySelector('[data-host-action="withdraw-settings"]');
    if(menuItem?.dataset.lifecycleRunId===runId)menuItem.hidden=true;
    if(hostActionContext===withdrawalContext){
      renderHostActionJob(result.job,result.message,result.workflow_html);
    }
  }catch(error){
    if(hostActionContext===withdrawalContext&&status){
      status.textContent=error instanceof Error?error.message:'The settings change could not be withdrawn.';
    }
  }
}
function activeHostActionJobId(root){

function hostActionReportIsChild(job,parentId){

  const id=String(job.id||'');
  if(!id||id===parentId)return false;
  return [job.settings_change_id,job.workflow?.settings_change_id,job.workflow?.parent_run_id].some(value=>String(value||'')===parentId);

function updateHostActionState(surface,host,backup){
  const root=surface.querySelector('[data-host-actions]');
  if(!root)return;
  const state=String(host.preferences_state||'applied');
  const kernel=host.kernel||{};
  const kernelState=String(kernel.state||'unknown');
  const nixcfgComparison=host.freshness?.nixcfg_comparison;
  const provenGitUpdate=nixcfgComparison?.relation==='behind'&&Number(nixcfgComparison.commits_behind)>0;
  const canManage=root.dataset.canManage==='true';
  const systemUpdateAvailable=root.dataset.systemUpdateAvailable==='true';
  const hostRemovalAvailable=root.dataset.hostRemovalAvailable==='true';
  const job=host.host_action||null;
  const workflow=job?.workflow||null;
  const retirement=host.retirement||null;
  root.dataset.settingsState=state;
  root.dataset.kernelState=kernelState;
  root.dataset.kernelRunning=String(kernel.running_version||'not reported');
  root.dataset.kernelExpected=String(kernel.expected_version||'not reported');
  root.dataset.deployedRevision=String(host.freshness?.deployment_evidence?.source_revision||'');
  root.dataset.nixcfgRevision=String(host.freshness?.nixcfg_comparison?.upstream_revision||'');
  root.dataset.nixpkgsRevision=String(host.freshness?.deployment_evidence?.nixpkgs_revision||'');
  root.dataset.retired=retirement?.pending===true?'true':'false';
  root.dataset.retirementDisposition=String(retirement?.disposition||'');
  root.dataset.retirementSuccessor=String(retirement?.successor||'');
  root.dataset.retirementDeclarationPending=retirement?.declaration_pending===true?'true':'false';
  root.dataset.retirementCredentialPending=retirement?.credential_retirement_pending===true?'true':'false';
  const openParentId=activeHostActionJobId(root);
  if(job&&!hostActionReportIsChild(job,openParentId)){
    root.dataset.actionJobId=String(job.id||'');
    root.dataset.actionKind=String(workflow?.kind||job.kind||'');
    root.dataset.actionState=String(job.state||'');
  }else if(openParentId){
    root.dataset.actionJobId=openParentId;
  }else{
    delete root.dataset.actionJobId;
    delete root.dataset.actionKind;
    delete root.dataset.actionState;
  }
  if(backup){root.dataset.backupState=String(backup.state||'unknown');root.dataset.backupLabel=String(backup.label||'Not observed')}
  const update=root.querySelector('[data-host-action="system-update"]');
  const restart=root.querySelector('[data-host-action="update-restart"]');
  const remove=root.querySelector('[data-host-action="remove"]');
  const withdraw=root.querySelector('[data-host-action="withdraw-settings"]');
  const primarySeparator=root.querySelector('[data-primary-separator]');
  const removeSeparator=root.querySelector('[data-remove-separator]');
  const updateJobActive=host.update_restart_active===true;
  const updatePending=kernelState==='reboot_required'||provenGitUpdate;
  const lifecycle=host.lifecycle||{};
  root.dataset.updatePending=updatePending?'true':'false';
  root.dataset.updateRestartActive=host.update_restart_active===true?'true':'false';
  const retired=retirement?.pending===true;
  const settingsWithdrawRunId=String(host.settings_change_withdraw_run_id||'');
  const settingsWithdrawable=settingsWithdrawRunId.length>0;
  if(withdraw){
    withdraw.hidden=!settingsWithdrawable;
    if(settingsWithdrawable)withdraw.dataset.lifecycleRunId=settingsWithdrawRunId;
    else delete withdraw.dataset.lifecycleRunId;
  }
  // PHAROS-197: mirrors the server gate — a removal that must record a nixcfg
  // declaration change or a retirement intent needs the proposal available.
  const needsRemovalProposal=root.dataset.declared==='true'||root.dataset.credentialRetirement==='true';
  const removalReady=!needsRemovalProposal||hostRemovalAvailable;
  if(update)update.hidden=retired||!(root.dataset.isNix==='true'&&canManage&&systemUpdateAvailable);
  if(restart){
    restart.hidden=retired||updateJobActive||lifecycle.slot==='blocked'||!(root.dataset.isNix==='true'&&canManage&&root.dataset.janusReady==='true'&&updatePending);
    const strong=restart.querySelector('strong');
    if(strong)strong.textContent='Review update and restart';
  }
  if(remove)remove.hidden=!removalReady||!canManage||retired;
  const continueBtn=root.querySelector('[data-host-action="lifecycle-continue"]');
  const lifecycleAction=lifecycle.primary_action;
  const lifecycleRunId=lifecycle.run_id?String(lifecycle.run_id):'';
  if(continueBtn){
    const show=lifecycleAction?.label&&lifecycleRunId;
    continueBtn.hidden=!show;
    if(show){
      continueBtn.dataset.lifecycleRunId=lifecycleRunId;
      continueBtn.dataset.lifecycleInvoke=String(lifecycle.invoke||'workflow');
      const strong=continueBtn.querySelector('strong');
      if(strong)strong.textContent=String(lifecycleAction.label);
    }
  }
  if(primarySeparator)primarySeparator.hidden=[continueBtn,withdraw,update,restart].every(item=>!item||item.hidden);
  if(removeSeparator)removeSeparator.hidden=!removalReady||!canManage||retired;
  if(openHostActionsRoot===root)positionHostActions(root);
}
function initHostActions(){
  document.addEventListener('click',event=>{
    const trigger=event.target.closest('[data-host-actions-trigger]');
    if(trigger){event.preventDefault();openHostActions(trigger.closest('[data-host-actions]'));return}
    const chip=event.target.closest('[data-host-lifecycle-chip]');
    if(chip){
      if(chip.disabled||chip.getAttribute('aria-disabled')==='true')return;
      event.preventDefault();
      const surface=chip.closest('[data-host-surface="runtime"]');
      const root=surface?.querySelector('[data-host-actions]');
      if(!root)return;
      const lifecycle=lifecycleFromChip(chip);
      const host=fleetHostsByName.get(root.dataset.host)||{};
      openHostLifecycleSheet(chip,root,lifecycle,host);
      return;
    }
    const actionItem=event.target.closest('[data-host-action]');
    if(actionItem&&actionItem.closest('[data-host-actions-menu]')&&!actionItem.matches('a')){
      event.preventDefault();
      const root=actionItem.closest('[data-host-actions]');
      if(actionItem.dataset.hostAction==='withdraw-settings'){
        withdrawSettingsChange(actionItem,root);
        return;
      }
      if(actionItem.dataset.hostAction==='lifecycle-continue'){
        const runId=actionItem.dataset.lifecycleRunId||'';
        const invoke=actionItem.dataset.lifecycleInvoke||'workflow';
        const action=invoke==='update_restart'?'update-restart':'workflow';
        openHostActionDialog(action,root,actionItem,runId);
        return;
      }
      openHostActionDialog(actionItem.dataset.hostAction,root,actionItem);
      return;
    }
    const refresh=event.target.closest('[data-host-action-refresh]');
    if(refresh&&!refresh.disabled){
      event.preventDefault();
      checkHostActionNow(refresh);
      return;
    }
    const primary=event.target.closest('[data-host-action-primary]');
    if(primary&&!primary.hidden&&!primary.disabled){
      event.preventDefault();
      submitHostAction();
      return;
    }
    if(event.target.closest('[data-host-action-close]')){event.preventDefault();closeHostActionDialog();return}
    if(openHostActionsRoot&&!event.target.closest('[data-host-actions]'))closeHostActions(openHostActionsRoot);
  });
  document.addEventListener('keydown',event=>{
    const overlay=document.querySelector('[data-host-action-overlay]');
    if(overlay&&!overlay.hidden){
      if(event.key==='Escape'){event.preventDefault();closeHostActionDialog();return}
      if(event.key==='Tab'){
        const focusable=Array.from(overlay.querySelectorAll('button:not([hidden]):not(:disabled),input:not([hidden]):not(:disabled),select:not([hidden]):not(:disabled)')).filter(el=>el.offsetParent!==null);
        if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}
      }
      return;
    }
    if(!openHostActionsRoot)return;
    const menu=openHostActionsRoot.querySelector('[data-host-actions-menu]');
    const items=visibleHostActionItems(menu);
    const index=items.indexOf(document.activeElement);
    if(event.key==='Escape'){event.preventDefault();closeHostActions(openHostActionsRoot,true)}
    else if(event.key==='ArrowDown'){event.preventDefault();items[(index+1+items.length)%items.length]?.focus()}
    else if(event.key==='ArrowUp'){event.preventDefault();items[(index-1+items.length)%items.length]?.focus()}
    else if(event.key==='Home'){event.preventDefault();items[0]?.focus()}
    else if(event.key==='End'){event.preventDefault();items[items.length-1]?.focus()}
    else if(event.key==='Tab')closeHostActions(openHostActionsRoot);
  });
  document.querySelector('[data-host-remove-input]')?.addEventListener('input',event=>{
    const primary=document.querySelector('[data-host-action-primary]');
    if(!primary||!hostActionContext)return;
    if(hostActionContext.action==='remove')primary.disabled=!hostActionConfirmationReady();
    else if((hostActionContext.action==='update-restart'||hostActionContext.action==='settings')&&hostActionContext.stage==='confirm')primary.disabled=!hostActionConfirmationReady();
  });
  document.querySelector('[data-host-remove-disposition]')?.addEventListener('change',updateHostRemovalForm);
  document.querySelector('[data-host-remove-successor-input]')?.addEventListener('input',updateHostRemovalForm);
  document.querySelector('[data-host-attended-input]')?.addEventListener('change',()=>{
    const primary=document.querySelector('[data-host-action-primary]');
    if(primary&&(hostActionContext?.action==='update-restart'||hostActionContext?.action==='settings')&&hostActionContext.stage==='confirm')primary.disabled=!hostActionConfirmationReady();
  });
  document.querySelector('[data-host-action-cancel]')?.addEventListener('click',submitHostActionCancellation);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){pauseHostActionPoll();return}
    if(hostActionContext?.jobId)scheduleHostActionPoll(hostActionContext.jobId,0);
  });
  window.addEventListener('focus',()=>{
    if(hostActionContext?.jobId)scheduleHostActionPoll(hostActionContext.jobId,0);
  });
  window.addEventListener('online',()=>{
    if(hostActionContext?.jobId)scheduleHostActionPoll(hostActionContext.jobId,0);
  });
  window.addEventListener('offline',()=>{
    pauseHostActionPoll();
    const status=document.querySelector('[data-host-action-status]');
    if(status&&hostActionContext)status.textContent='Offline. The saved workflow will refresh when connectivity returns.';
  });
  window.addEventListener('pagehide',stopHostActionPoll);
  window.addEventListener('resize',()=>closeHostActions(openHostActionsRoot));
  window.addEventListener('scroll',closeHostActionsOnScroll,true);
}

function nixChannelEndOfLife(channel,now){
  const match=/^nixos-(\d{2})\.(05|11)$/.exec(String(channel||''));
  if(!match||!Number.isFinite(Number(now)))return false;
  const releaseYear=2000+Number(match[1]);
  const eolMonth=match[2]==='05'?1:7;
  const date=new Date(Number(now)*1000);
  const year=date.getUTCFullYear();
  const month=date.getUTCMonth()+1;
  return year>releaseYear+1||(year===releaseYear+1&&month>=eolMonth);
}
function nixpkgsAgeWarning(f,now,threshold=30){
  if(!f?.applicable||!f.deployment_evidence||f.nixpkgs_comparison?.relation!=='different')return false;
  const stamp=Number(f.deployment_evidence.nixpkgs_last_modified);
  if(f.deployment_evidence.nixpkgs_last_modified==null||!Number.isFinite(stamp)||!Number.isFinite(Number(now)))return false;
  const age=Math.floor(Math.max(0,Number(now)-stamp)/86400);
  return age<=36500&&age>threshold;
}
function updateFreshness(surface,f,now,threshold=30){
  if(surface.classList.contains('card')){
    const applicable=Boolean(f&&f.applicable!==false);
    const evidence=applicable?f.deployment_evidence:null;
    const evidenceMissing=applicable&&!evidence;
    const channel=String(evidence?.nixpkgs_channel||f?.nixpkgs_channel||'nixpkgs');
    const eol=Boolean(evidence&&!evidenceMissing&&nixChannelEndOfLife(channel,now));
    const nixpkgs=f?.nixpkgs_comparison;
    const nixcfg=f?.nixcfg_comparison;
    setFreshRow(surface,'freshness-unverified',{value:'unverified',klass:'na',label:'Freshness',visible:evidenceMissing});
    setFreshRow(surface,'nixpkgs-eol',{value:channel+' end of life',klass:'warn',label:'nixpkgs',visible:eol});
    setFreshRow(surface,'nixpkgs-drift',{
      value:nixpkgs?.relation==='different'?'nixpkgs differs from '+channel:'nixpkgs comparison unknown',
      klass:nixpkgs?.relation==='different'?'warn':'na',
      label:'nixpkgs',
      visible:Boolean(evidence&&(!nixpkgs||nixpkgsAgeWarning(f,now,threshold)))
    });
    const nixcfgValue=nixcfg?.relation==='behind'
      ? String(Number(nixcfg.commits_behind)||0)+' commits behind'
      : nixcfg?.relation==='ahead'
        ? 'deployed revision ahead'
        : nixcfg?.relation==='diverged'
          ? 'deployed revision diverged'
          : 'nixcfg comparison unknown';
    setFreshRow(surface,'nixcfg-drift',{
      value:nixcfgValue,
      klass:nixcfg?.relation&&nixcfg.relation!=='current'?'warn':'na',
      label:'nixcfg',
      visible:Boolean(evidence&&nixcfg?.relation!=='current')
    });
    updateConfigEvidence(surface,f);
    return;
  }
  if(!f||f.applicable===false){
    setFreshRow(surface,'flake-lock-age',{value:'n/a',klass:'na',label:'Flake.lock age'});
    setFreshRow(surface,'commits-behind',{value:'n/a',klass:'na'});
    setFreshRow(surface,'deployment-evidence',{value:'n/a',klass:'na',label:'Active generation'});
    setFreshRow(surface,'secondary-nixpkgs',{value:'n/a',klass:'na',label:'Other root nixpkgs'});
    updateConfigEvidence(surface,f);
    return;
  }
  const evidence=f.deployment_evidence;
  const nixcfg=f.nixcfg_comparison;
  const nixpkgs=f.nixpkgs_comparison;
  const ageDays=Number(f.nixpkgs_age_days);
  const hasAge=f.nixpkgs_age_days!=null&&Number.isFinite(ageDays);
  const channel=String(evidence?.nixpkgs_channel||f.nixpkgs_channel||'');
  const relation=nixpkgs?.relation;
  const suffix=relation==='current'?'exact':relation==='different'?'differs':'unknown';
  const age=evidence&&hasAge
    ? {value:String(ageDays)+'d · '+suffix,klass:relation==='current'?'ok':nixpkgsAgeWarning(f,now,threshold)?'warn':'na'}
    : {value:'unverified',klass:'na'};
  if(evidence&&nixChannelEndOfLife(channel,now)){
    age.value=age.value+' · EOL';
    age.klass='warn';
  }
  age.label=channel?'nixpkgs lock ('+channel+')':'nixpkgs lock';
  const commits=nixcfg?.relation==='current'
    ? {value:'exact',klass:'ok'}
    : nixcfg?.relation==='behind'
      ? {value:String(Number(nixcfg.commits_behind))+' behind',klass:'warn'}
      : nixcfg?.relation==='ahead'
        ? {value:'ahead',klass:'warn'}
        : nixcfg?.relation==='diverged'
          ? {value:'diverged',klass:'warn'}
          : {value:'unknown',klass:'na'};
  setFreshRow(surface,'flake-lock-age',age);

  if(typeof prefs.kind==='string'&&prefs.kind&&prefs.kind!=='server')parts.push(String(prefs.kind));

function freeformTarget(grid,x,y){

  let bestDistance=Infinity;
  let bestAfter=false;
  grid.querySelectorAll('.card:not([data-dragging]):not([hidden])').forEach(card=>{
    const box=card.getBoundingClientRect();
    const cx=box.left+box.width/2;
    const cy=box.top+box.height/2;
    const distance=Math.hypot(x-cx,(y-cy)*1.35);
    if(distance<bestDistance){
      best=card;
      bestDistance=distance;

  });

  grid.dataset.freeformBound='true';
  let drag=null;

    if(!drag)return;
    delete drag.card.dataset.dragging;
    drag.card.style.zIndex='';
    delete grid.dataset.freeformDragging;
    writeFreeformOrder();
    applyFreeformOrder();

  }
  grid.addEventListener('pointerdown',event=>{
    const handle=event.target.closest('[data-drag-handle]');
    if(!handle||!grid.contains(handle))return;
    if(document.querySelector('main')?.dataset.arrange!=='freeform')return;
    if(event.button!==0)return;
    const card=handle.closest('.card');
    if(!card)return;
    event.preventDefault();
    handle.setPointerCapture?.(event.pointerId);
    drag={card,pointerId:event.pointerId};
    card.dataset.dragging='true';
    card.style.zIndex='20';
    grid.dataset.freeformDragging='true';

  grid.addEventListener('pointermove',event=>{
    if(!drag||event.pointerId!==drag.pointerId)return;
    event.preventDefault();

    if(!target.card){
      grid.appendChild(drag.card);
      return;
    }
    const before=target.after?target.card.nextSibling:target.card;
    if(before!==drag.card)grid.insertBefore(drag.card,before);
  });

  if(sshAuthenticated!==undefined)facts.ssh_authenticated=sshAuthenticated;
  if(nixAvailable!==undefined)facts.nix_available=nixAvailable;
  if(pharosReachable!==undefined)facts.pharos_reachable=pharosReachable;
  if(admin==='root'){facts.root=true;facts.sudo=false}
  else if(admin==='sudo'){facts.root=false;facts.sudo=true}
  else if(admin==='none'){facts.root=false;facts.sudo=false}
  if(os==='nixos'){facts.os_family='nixos';facts.nixos=true;facts.nix_available=true}
  else if(os==='linux'){facts.os_family='linux';facts.nixos=false}
  else if(os==='other'){facts.os_family='other';facts.nixos=false}
  if(diskRaw){
    const disk=Number(diskRaw);
    if(Number.isFinite(disk)&&disk>=0)facts.free_disk_gib=Math.floor(disk);
  }
  return {
    host_name:hostName,
    ssh:{
      route,
      user:sshUser||undefined,
      host:route==='none'?undefined:sshHost||undefined

async function createPaidProvisioningJob(overlay,start){
  const job=overlay?.pharosProvisioningJob;
  const plan=job?.reviewed_plan;
  const executionState=String(job?.paid_execution?.state||'');
  if(!job?.id||!plan?.plan_sha256||!job?.paid_authorization){
    throw new Error('Authorize the exact persisted plan before creating the server.');
  }
  if(paidPlanExpired(job)&&overlay.dataset.assistantPaidStage!=='reconcile'&&executionState!=='claimed'){
    resetPaidPlanReview(overlay);
    await loadProviderPlanReview(overlay);
    return;
  }
  overlay.dataset.assistantPaidActionPending='true';
  setAssistantStartLabel(start,'Creating server');
  start.disabled=true;
  const title=overlay.querySelector('#setup-assistant-title');
  const copy=title?.parentElement?.querySelector('p');
  if(title)title.textContent='Creating authorized server';
  if(copy)copy.textContent='Pharos is rechecking the exact plan before sending one provider request.';
  const response=await fetch(appUrl(`/setup/provisioning-jobs/${encodeURIComponent(job.id)}/create`),{
    method:'POST',
    credentials:'same-origin',
    headers:{'content-type':'application/json','accept':'application/json','X-Pharos-Action':'1'},
    body:JSON.stringify({plan_sha256:plan.plan_sha256}),
    cache:'no-store'
  });
  const payload=await response.json().catch(()=>({}));
  if(!response.ok){
    if(payload.job?.paid_execution?.state==='failed-closed'){
      resetPaidPlanReview(overlay);

const PROVIDER_CLEANUP_RECOVERY_DELAYS_MS=[250,750,1500,3000,6000,9000,10000];
function providerCleanupRecorded(job){
  return primaryProviderResource(job)?.state==='deleted';
}
function providerCleanupComplete(job){
  return providerCleanupRecorded(job)&&
    job?.state==='complete'&&
    job?.terminal_outcome==='rolled-back';
}
function waitForProviderCleanupRecovery(delay){
  return new Promise(resolve=>window.setTimeout(resolve,delay));
}
async function refreshFleetAfterProviderCleanup(overlay,job){
  if(!providerCleanupComplete(job)||typeof refresh!=='function')return false;
  const resource=primaryProviderResource(job);
  const refreshKey=`${job.id||''}:${job.updated_at||''}:${resource?.provider_id||''}`;
  if(overlay?.dataset.providerCleanupFleetRefresh===refreshKey)return false;
  if(overlay)overlay.dataset.providerCleanupFleetRefresh=refreshKey;
  return refresh('provider-cleanup',{force:true,recovery:true});
}
async function recoverTrackedProviderDeletion(overlay,jobId,status){
  if(status)status.textContent='Confirming the provider result…';
  for(const delay of PROVIDER_CLEANUP_RECOVERY_DELAYS_MS){
    await waitForProviderCleanupRecovery(delay);
    try{
      const job=await fetchProvisioningJob(jobId);
      renderProvisioningJob(overlay,job);
      if(providerCleanupRecorded(job)){
        if(!provisioningJobTerminal(job))scheduleProvisioningPoll(overlay,job.id);
        await refreshFleetAfterProviderCleanup(overlay,job);
        return true;
      }
    }catch(_error){}
  }
  return false;
}
async function deleteTrackedProviderServer(overlay,button){
  const job=overlay?.pharosProvisioningJob;
  if(!job?.id)throw new Error('The tracked setup job is not available.');
  const confirm=overlay.querySelector('[data-created-delete-confirm]');
  const status=overlay.querySelector('[data-created-delete-status]');
  if(!confirm?.checked)throw new Error('Confirm permanent deletion first.');
  button.disabled=true;
  button.setAttribute('aria-busy','true');
  if(status)status.textContent='Deleting the tracked server…';
  let response;
  try{
    response=await fetch(appUrl(`/setup/provisioning-jobs/${encodeURIComponent(job.id)}/cleanup`),{
      method:'POST',
      credentials:'same-origin',
      headers:{'content-type':'application/json','accept':'application/json','X-Pharos-Action':'1'},
      body:JSON.stringify({confirm:true}),
      cache:'no-store'
    });
  }catch(_error){
    if(await recoverTrackedProviderDeletion(overlay,job.id,status))return {state:'deleted',recovered:true};
    throw new Error('Provider deletion is not confirmed. Pharos did not send a second delete request.');
  }
  const payload=await response.json().catch(()=>({}));
  if(payload.job)renderProvisioningJob(overlay,payload.job);
  if(!response.ok||!payload.job){
    if(providerCleanupRecorded(payload.job)){
      if(!provisioningJobTerminal(payload.job))scheduleProvisioningPoll(overlay,payload.job.id);
      await refreshFleetAfterProviderCleanup(overlay,payload.job);
      return payload.cleanup||{state:'deleted',recovered:true};
    }
    if(await recoverTrackedProviderDeletion(overlay,job.id,status))return {state:'deleted',recovered:true};
    throw new Error(payload.error||'Provider deletion is not confirmed. Pharos did not send a second delete request.');
  }
  if(!provisioningJobTerminal(payload.job))scheduleProvisioningPoll(overlay,payload.job.id);
  await refreshFleetAfterProviderCleanup(overlay,payload.job);
  return payload.cleanup||{};
}
async function attestProvisioningHostKey(overlay,button){
