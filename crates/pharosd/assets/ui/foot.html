    const reviewDetails=overlay.querySelector('[data-assistant-review-details]');
    if(reviewDetails)reviewDetails.open=false;
  }
  overlay.querySelectorAll('[data-assistant-path]').forEach(btn=>{
    btn.setAttribute('aria-pressed',String(btn.dataset.assistantPath===safePath));
  });
  if(safePath!==previousPath){
    const backupValue=safePath==='new'?'enroll-later':'deferred';
    const backup=overlay.querySelector(`input[name="backup_intent"][value="${backupValue}"]`);
    if(backup)backup.checked=true;
    const confirm=overlay.querySelector('[data-assistant-confirm]');
    if(confirm)confirm.checked=false;
  }
  if(safePath==='new'){
    overlay.dataset.assistantStage='template';
    setAssistantProvider('hetzner-cloud',false);
    setAssistantTemplate('',false);
  }else if(safePath==='existing'){
    overlay.dataset.assistantStage='existing';
    setAssistantProvider('',false);
    setAssistantTemplate('',false);
  }else{
    overlay.dataset.assistantStage='choose';
    setAssistantProvider('',false);
    setAssistantTemplate('',false);
  }
  syncAssistantNext(overlay);
  if(write){
    const state=assistantState(overlay);
    writeAssistantUrl(!overlay.hidden,state.path,state.provider,state.template,state.stage);
  }
}
function setAssistantOpen(open,write=true){
  const overlay=document.querySelector('[data-setup-assistant]');
  if(!overlay)return;
  const wasHidden=overlay.hidden;
  if(open&&wasHidden&&document.activeElement instanceof HTMLElement)assistantReturnFocus=document.activeElement;
  overlay.hidden=!open;
  document.body.dataset.assistantOpen=open?'true':'false';
  if(!open){
    window.clearTimeout(window.pharosAssistantJobTimer);
    window.clearTimeout(window.pharosAssistantPaidExpiryTimer);
    delete overlay.dataset.providerCreated;
    delete overlay.dataset.assistantJobId;
    delete overlay.dataset.assistantPaidStage;
    overlay.pharosProvisioningJob=null;
    const created=overlay.querySelector('[data-assistant-created]');
    if(created)created.hidden=true;
    const job=overlay.querySelector('[data-assistant-job]');
    if(job)job.hidden=true;
    showAssistantError(overlay);
    setAssistantPath('',false);
  }else if(!overlay.dataset.assistantStage){
    overlay.dataset.assistantStage='choose';
    syncAssistantNext(overlay);
  }
  if(write){
    const state=assistantState(overlay);
    writeAssistantUrl(open,state.path,state.provider,state.template,state.stage);
  }
  if(open)overlay.querySelector('[data-assistant-path]')?.focus();
  else if(!wasHidden&&assistantReturnFocus?.isConnected){
    assistantReturnFocus.focus();
    assistantReturnFocus=null;
  }
}
function restoreAssistantFromUrl(){
  const overlay=document.querySelector('[data-setup-assistant]');
  if(!overlay)return;
  const params=new URLSearchParams(location.search);
  const open=params.get(ASSISTANT_SETUP_PARAM)==='add-server';
  setAssistantOpen(open,false);
  if(!open){
    setAssistantPath('',false);
    return;
  }
  const path=assistantPath(params.get(ASSISTANT_PATH_PARAM));
  setAssistantPath(path,false);
  if(path==='new'){
    setAssistantProvider(assistantProvider(params.get(ASSISTANT_PROVIDER_PARAM))||'hetzner-cloud',false);
    setAssistantTemplate(params.get(ASSISTANT_TEMPLATE_PARAM),false);
  }
  const jobId=(params.get(ASSISTANT_JOB_PARAM)||'').trim();
  if(jobId&&jobId.length<=128){
    fetchProvisioningJob(jobId).then(job=>{
      const paidReview=renderAssistantProvisioningJob(overlay,job);
      if(!paidReview&&!provisioningJobTerminal(job))scheduleProvisioningPoll(overlay,job.id);
    }).catch(error=>{
      showAssistantError(overlay,error.message||'The setup job could not be loaded.');
      if(document.activeElement&&overlay.contains(document.activeElement)&&document.activeElement.getClientRects().length===0){
        overlay.querySelector('[data-assistant-close]')?.focus();
      }
    });
    return;
  }
  if(path==='new'){
    const requestedStage=assistantStage(params.get(ASSISTANT_STAGE_PARAM));
    overlay.dataset.assistantStage=assistantState(overlay).template&&requestedStage==='plan'?'plan':'template';
    syncAssistantNext(overlay);
    if(overlay.dataset.assistantStage==='plan'){
      loadProviderPlanReview(overlay).catch(()=>updateProviderReadiness(overlay));
    }
  }else if(path==='existing'){
    overlay.dataset.assistantStage='existing';
    syncAssistantNext(overlay);
  }
}

  document.addEventListener('keydown',event=>{
    if(overlay.hidden)return;

      setAssistantOpen(false);
      return;
    }
    if(event.key!=='Tab')return;
    const focusable=[...overlay.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])')]

    if(!focusable.length){
      event.preventDefault();
      overlay.querySelector('[data-assistant-close]')?.focus();
      return;
    }
    const first=focusable[0];
    const last=focusable[focusable.length-1];
    if(!focusable.includes(document.activeElement)){
      event.preventDefault();
      (event.shiftKey?last:first).focus();
      return;
    }
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}

  overlay.querySelector('[data-created-delete]')?.addEventListener('click',async event=>{

async function runProviderAction(button,url,body){
  const original=button?.innerHTML||'';
  if(button){
    button.disabled=true;
    button.setAttribute('aria-busy','true');
  }
  setProviderActionStatus('Working…');
  try{
    const options={method:'POST',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json','X-Pharos-Action':'1'}};
    if(body!==undefined){
      options.headers['Content-Type']='application/json';
      options.body=JSON.stringify(body);
    }
    const response=await fetch(appUrl(url),options);
    const payload=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(payload.error||'The provider action did not complete.');
    location.reload();
  }catch(error){
    setProviderActionStatus(error.message||'The provider action did not complete.',true);
    if(button){
      button.disabled=false;
      button.removeAttribute('aria-busy');
      button.innerHTML=original;
    }
  }
}

function fleetDocumentPath(){
  if(typeof document==='undefined'||typeof document.querySelector!=='function')return '';
  if(!document.querySelector('main[data-fleet-sync-state]'))return '';
  const path=String(typeof location==='undefined'?'':location.pathname||'');
  return path.startsWith('/')?path:'';
}
function navigationApi(){
  const scope=typeof globalThis==='undefined'?null:globalThis;
  return scope&&scope.navigation?scope.navigation:null;
}
function readNavigationState(){
  const entry=navigationApi()?.currentEntry;
  if(!entry||typeof entry.getState!=='function')return null;
  try{return entry.getState()}catch(_){return null}
}
function withFleetMarker(existing){
  const path=fleetDocumentPath();
  if(!path)return null;
  const state=existing&&typeof existing==='object'&&!Array.isArray(existing)?{...existing}:{};
  state.pharosFleet={path};
  return state;
}
function applyFleetMarker(state){
  const nav=navigationApi();
  if(!state||!nav||typeof nav.updateCurrentEntry!=='function')return false;
  try{nav.updateCurrentEntry({state});return true}catch(_){return false}
}
function markFleetEntry(){
  const existing=readNavigationState();
  const prior=existing&&typeof existing==='object'?existing:(typeof history==='undefined'?null:history.state);
  return applyFleetMarker(withFleetMarker(prior));
}
function fleetSearchText(){
  const state=readNavigationState()??(typeof history==='undefined'?null:history.state);
  if(!state||typeof state!=='object'||Array.isArray(state)||typeof state.pharosSearch!=='string')return null;
  return state.pharosSearch;
}
function replaceDocumentUrl(url){
  const prior=readNavigationState()??(typeof history==='undefined'?null:history.state);
  const state=withFleetMarker(prior);
  history.replaceState(state,'',url);
  if(state)applyFleetMarker(state);
}
function updateUrlState(){
  const main=document.querySelector('main');
  const sort=document.querySelector('[data-sort]')?.value||'attention';
  const params=new URLSearchParams(location.search);
  params.set('view',main?.dataset.view||'grid');
  params.set('sort',sort);
  params.set('filter',activeLiveFilter);
  params.set('signal',signalWindow.key);
  const search=document.querySelector('input[data-search]')?.value||'';
  if(fleetDocumentPath())params.delete('q');
  else if(search)params.set('q',search);
  else params.delete('q');
  const query=params.toString();
  const url=location.pathname+(query?'?'+query:'');
  const prior=readNavigationState()??(typeof history==='undefined'?null:history.state);
  const state=withFleetMarker(prior);
  if(!state){
    replaceDocumentUrl(url);
    return;
  }
  if(search)state.pharosSearch=search;
  else delete state.pharosSearch;
  history.replaceState(state,'',url);
  applyFleetMarker(state);
}

const REFRESH_MS=10000;
const DIALOG_REFRESH_MS=60000;
const FETCH_TIMEOUT_MS=9000;
const MAX_SNAPSHOT_AGE_MS=REFRESH_MS*2+FETCH_TIMEOUT_MS;
let refreshTimer=null;
let refreshPromise=null;
let refreshAbort=null;
let refreshGeneration=0;
let recoveryPromise=null;
let lastFleetFailureKind='';
let lastSuccessfulRefreshAt=Date.now();
function fleetMain(){return document.querySelector('main[data-fleet-sync-state]')}
function fleetSnapshotFresh(at=Date.now()){
  return !fleetMain()||at-lastSuccessfulRefreshAt<=MAX_SNAPSHOT_AGE_MS;
}
function fleetSnapshotLabel(asof){
  const label=asof?.dataset.snapshotLabel||asof?.textContent||'last update unavailable';
  return label.startsWith('as of ')?'last update '+label.slice(6):label;
}
function pageFrozen(){
  if(document.body?.dataset?.fleetLifecycleFrozen==='true')return true;
  if(document.hidden)return true;
  const state=document.visibilityState;
  if(state==null||state==='')return false;
  return state==='hidden'||state==='prerender';
}
function ensureFleetRecovery(kind){
  if(typeof document.createElement!=='function'||!document.body)return;
  const model=fleetRecoveryModel(kind);
  let box=document.querySelector('[data-fleet-recovery]');
  if(!box){
    box=document.createElement('div');
    box.className='fleet-recovery';
    box.dataset.fleetRecovery='true';
    box.hidden=true;
    const retry=document.createElement('button');
    retry.type='button';
    retry.dataset.fleetRetry='true';
    retry.textContent='Retry';
    retry.addEventListener('click',()=>{if(!pageFrozen())recoverFleet('retry')});
    const signIn=document.createElement('a');
    signIn.dataset.fleetSignIn='true';
    signIn.textContent='Sign in';
    box.append(retry,signIn);
    const asof=fleetMain()?.querySelector('[data-as-of]');
    if(asof&&typeof asof.insertAdjacentElement==='function')asof.insertAdjacentElement('afterend',box);
    else document.body.appendChild(box);
  }
  const retry=box.querySelector('[data-fleet-retry]');
  const signIn=box.querySelector('[data-fleet-sign-in]');
  if(!model){box.hidden=true;return}
  box.hidden=false;
  if(retry)retry.hidden=model.action!=='retry';
  if(signIn){
    signIn.hidden=model.action!=='sign-in';
    if(model.action==='sign-in'){
      const path=(window.location?.pathname||'/')+(window.location?.search||'');
      signIn.href=appUrl('/auth/login?return_to='+encodeURIComponent(path));
    }
  }
}
function setFleetSyncState(state,reason){
  const main=fleetMain();
  if(!main)return;
  main.dataset.fleetSyncState=state;
  if(state==='current')lastFleetFailureKind='';
  else if(reason)lastFleetFailureKind=reason;
  const asof=main.querySelector('[data-as-of]');
  if(asof){
    if(!asof.dataset.snapshotLabel)asof.dataset.snapshotLabel=asof.textContent||'';
    asof.dataset.refreshState=state;
    if(state==='syncing')asof.textContent='Syncing\u2026 \u00b7 '+fleetSnapshotLabel(asof);
    else if(state==='stale')asof.textContent='Data out of date \u00b7 '+fleetSnapshotLabel(asof);
    else asof.textContent=asof.dataset.snapshotLabel;
  }
  if(state!=='current')document.querySelectorAll('.beat').forEach(beat=>{beat.dataset.beatLive='false'});
  if(state==='stale')ensureFleetRecovery(reason||lastFleetFailureKind||'unavailable');
  else ensureFleetRecovery('');
}
function setFleetSnapshotLabel(now){
  const asof=fleetMain()?.querySelector('[data-as-of]');
  if(!asof)return;
  asof.dataset.snapshotLabel='as of '+clock(now);
}
function updateFleetSummary(hosts){
  const counts={all:hosts.length,live:0,stale:0,down:0};
  hosts.forEach(host=>{if(['live','stale','down'].includes(host.liveness))counts[host.liveness]++});
  Object.entries(counts).forEach(([key,value])=>{
    const target=document.querySelector('[data-summary-count="'+key+'"]');
    if(target)target.textContent=String(value);
  });
}
function validFleetSnapshot(data){
  if(!data||!Number.isFinite(Number(data.as_of))||!Array.isArray(data.hosts))return false;
  const names=data.hosts.map(host=>host?.name);
  return new Set(names).size===names.length&&data.hosts.every(host=>host&&typeof host.name==='string'&&host.name&&['live','stale','down','awaiting_first_heartbeat'].includes(host.liveness));
}
function fleetMembershipMatches(hosts){
  const grid=document.querySelector('[data-grid]');
  if(!grid)return true;
  const rendered=new Set(Array.from(grid.querySelectorAll('.card[data-host][data-host-surface="runtime"]')).map(card=>card.dataset.host));
  const incoming=new Set(hosts.map(host=>host.name));
  return rendered.size===incoming.size&&Array.from(rendered).every(name=>incoming.has(name));
}
function applyFleetSnapshot(data){
  if(!validFleetSnapshot(data))return false;
  const hosts=data.hosts;
  fleetHostsByName=new Map(hosts.map(host=>[host.name,host]));
  if(!fleetMembershipMatches(hosts)){
    window.location.reload();
    return false;
  }
  const now=Number(data.as_of);
  for(const h of hosts){
    const surfaces=hostSurfaces(h.name);
    const assurance=projectHostAssurance(h,now);
    for(const card of surfaces){
      const live=h.liveness;
      card.dataset.live=live;
      const attention=h.attention||attentionFor(h.liveness,h.freshness,h.preferences,now,h.nixpkgs_warn_after_days);
      const backup=backupInfo(h,now);
      const muted=mutedInfo(h.preferences);
      card.dataset.sev=String(attention.rank ?? sevFor(live));
      card.dataset.last=h.last_seen ?? 0;
      card.dataset.search=(String(h.name||'')+' '+String(h.role||'')+' '+String(h.freshness_tldr||'')+' '+String(attention.label||'')+' '+String(backup.search||'')+' '+String(h.lifecycle?.label||'')+' '+kernelSearch(h.kernel)+' '+muted.search).toLowerCase().trim();
      const word=card.querySelector('[data-status-word]');
      if(word)word.textContent=words[h.liveness]||h.liveness;
      setReason(card,attention);
      updatePreferenceState(card,h);
      updateHostActionState(card,h,backup);
      updateHostLifecycle(card,h);
      updateReasonVisibility(card,attention,h.freshness,h.kernel,now,h.lifecycle,h.nixpkgs_warn_after_days);
      updateMuted(card,muted);
      updateKernelFault(card,h);
      updateFreshness(card,h.freshness,now,h.nixpkgs_warn_after_days);
      updateBackupStatus(card,backup.protection);
      updateHealthProjection(card,assurance.health);
      setSeen(card,h.last_seen,now);
      setCardAsOf(card,now);
      const beat=card.querySelector('.beat');
      if(beat){
        const previous=Number(beat.dataset.last);
        const last=h.last_seen == null ? NaN : Number(h.last_seen);
        const interval=h.heartbeat_interval_secs || 60;
        const incoming=Array.isArray(h.heartbeat_log)?h.heartbeat_log.map(Number).filter(Number.isFinite):[];
        const beats=incoming.length?incoming:(Number.isFinite(last)?[last]:[]);
        const grace=resolveHeartbeatGrace(h,data.fleet_heartbeat_grace_secs);
        const bounds=cadenceBounds(interval,grace.secs);
        beat.dataset.interval=interval;
        beat.dataset.grace=String(grace.secs);
        beat.dataset.graceSource=grace.source;
        beat.dataset.lateAfter=String(grace.lateAfter==null?bounds.lateAfter:grace.lateAfter);
        beat.dataset.last=Number.isFinite(last)?String(last):'';
        beat.dataset.nextAt=Number.isFinite(last)?String(last+interval):'';
        setBeatHistory(beat,beats,interval,now,grace.secs);
        updateBeatClock(beat,now);
        if(beat.dataset.ready==='true'&&Number.isFinite(previous)&&Number.isFinite(last)&&last>previous){
          beat.style.setProperty('--hit-x',beat.style.getPropertyValue('--cadence-x')||'0%');
          flashBeat(beat);
        }
        beat.dataset.ready='true';
      }
    }
    updateOpenHostDrawer(h,now);
  }
  updateFleetSummary(hosts);
  applySort(document.querySelector('[data-sort]')?.value||'attention',false);
  applySurfaceFilters(false);
  setFleetSnapshotLabel(now);
  return true;
}
function clearRefreshTimer(){
  if(refreshTimer!=null){
    clearTimeout(refreshTimer);
    refreshTimer=null;
  }
}
function nextRefreshDelay(){
  return document.body.dataset.hostActionDialogOpen==='true'?DIALOG_REFRESH_MS:REFRESH_MS;
}
function scheduleRefresh(delay=nextRefreshDelay()){
  clearRefreshTimer();
  if(!fleetMain()||pageFrozen())return;
  refreshTimer=setTimeout(()=>refresh('timer'),delay);
}
function classifyFleetResponse(res){
  const status=Number(res?.status);
  const type=String(res?.headers?.get?.('content-type')||'').toLowerCase();
  if(res?.redirected||status===401||status===403||type.includes('text/html'))return 'auth';
  if(!res?.ok||!type.includes('application/json'))return 'unavailable';
  return '';
}
function abandonRefresh(){
  clearRefreshTimer();
  if(refreshAbort)refreshAbort.abort();
  refreshGeneration++;
  refreshAbort=null;
  refreshPromise=null;
}
async function refresh(reason='manual',options={}){
  if(!fleetMain())return false;
  clearRefreshTimer();
  if(options.force===true&&refreshPromise)abandonRefresh();
  if(refreshPromise)return refreshPromise;
  const controller=new AbortController();
  const generation=++refreshGeneration;
  refreshAbort=controller;
  const timeout=setTimeout(()=>controller.abort(),FETCH_TIMEOUT_MS);
  refreshPromise=(async()=>{
  try{
    const res=await fetch(appUrl('/hosts.json?refresh='+Date.now()),{headers:{Accept:'application/json'},cache:'no-store',credentials:'same-origin',signal:controller.signal});
    const failure=classifyFleetResponse(res);
    if(failure){
      const error=new Error('fleet snapshot unavailable');
      error.fleetKind=failure;
      throw error;
    }
    const data=await res.json();
    if(generation!==refreshGeneration)return false;
    if(!validFleetSnapshot(data)){
      const error=new Error('fleet snapshot invalid');
      error.fleetKind='invalid';
      throw error;
    }
    if(!applyFleetSnapshot(data))return false;
    lastSuccessfulRefreshAt=Date.now();
    setFleetSyncState('current');
    resumeBeatClock();
    return true;
  }catch(error){
    if(generation!==refreshGeneration)return false;
    const kind=error?.name==='AbortError'?'abort':(error?.fleetKind||(typeof navigator!=='undefined'&&navigator.onLine===false?'offline':'unavailable'));
    if(kind==='auth'||options.recovery===true||!fleetSnapshotFresh()){
      if(kind==='auth'&&options.recovery!==true)stopBeatClock();
      setFleetSyncState('stale',kind);
    }
    return false;
  }
  finally{
    clearTimeout(timeout);
    if(generation===refreshGeneration){
      if(refreshAbort===controller)refreshAbort=null;
      refreshPromise=null;
      scheduleRefresh();
    }
  }
  })();
  return refreshPromise;
}
function suspendFleet(){
  stopBeatClock();
  abandonRefresh();
  recoveryPromise=null;
  if(typeof fleetWatchdogTimer!=='undefined'&&fleetWatchdogTimer!=null){clearTimeout(fleetWatchdogTimer);fleetWatchdogTimer=null}
}
function recoverFleet(reason='foreground'){
  if(!fleetMain()||pageFrozen())return Promise.resolve(false);
  if(recoveryPromise)return recoveryPromise;
  stopBeatClock();
  setFleetSyncState('syncing');
  let recoveryRun;
  recoveryRun=refresh(reason,{force:true,recovery:true}).finally(()=>{if(recoveryPromise===recoveryRun)recoveryPromise=null});
  recoveryPromise=recoveryRun;
  return recoveryPromise;
}
function resumeRefresh(reason){
  if(pageFrozen()){
    suspendFleet();
    return Promise.resolve(false);
  }
  return recoverFleet(reason);
}
let activeFreshPopover=null;
let activeFreshPopoverChip=null;
function hideFreshPopover(){
  if(activeFreshPopover)activeFreshPopover.classList.remove('visible');
  if(activeFreshPopoverChip)activeFreshPopoverChip.removeAttribute('aria-describedby');
  activeFreshPopoverChip=null;
}
function focusFreshnessFallback(surface,current,preferred=[]){
  const rail=current?.closest?.('.freshness-rail')||surface.querySelector('.freshness-rail');
  const isAvailable=node=>Boolean(node)&&!node.hidden&&(
    node.classList.contains('fresh-row-compact')
      ||(node.classList.contains('fresh-chevron')&&node.classList.contains('visible'))
      ||node.matches('[data-host-actions-trigger]')
  );
  let target=preferred.find(isAvailable)||null;
  if(!target&&rail&&!rail.hidden&&current?.classList?.contains('fresh-row-compact')){
    const chips=Array.from(rail.querySelectorAll('.fresh-row-compact'));
    const index=chips.indexOf(current);
    target=chips.slice(index+1).find(isAvailable)
      ||chips.slice(0,Math.max(0,index)).reverse().find(isAvailable)
      ||null;
  }
  if(!target&&rail&&!rail.hidden){
    target=Array.from(rail.querySelectorAll('.fresh-chevron.visible')).find(isAvailable)||null;
  }
  if(!target)target=surface.querySelector('[data-host-actions-trigger]:not([hidden])');
  if(target&&target!==current){
    target.focus();
    return;
  }
  surface.setAttribute('tabindex','-1');
  surface.focus();
}
function updateFreshnessRailOverflow(rail){
  const container=rail.querySelector('[data-fresh-scroll-container]');
  const left=rail.querySelector('.fresh-chevron-left');
  const right=rail.querySelector('.fresh-chevron-right');
  if(!container||!left||!right||rail.hidden)return;
  const canLeft=container.scrollLeft>1;
  const canRight=container.scrollLeft<container.scrollWidth-container.clientWidth-1;
  const focused=document.activeElement;
  left.classList.toggle('visible',canLeft);
  right.classList.toggle('visible',canRight);
  const surface=rail.closest('[data-host-surface="runtime"]');
  if(surface&&focused===left&&!canLeft)focusFreshnessFallback(surface,left,canRight?[right]:[]);
  if(surface&&focused===right&&!canRight)focusFreshnessFallback(surface,right,canLeft?[left]:[]);
  rail.dataset.overflowRight=canRight?'true':'false';
}
function syncFreshnessRail(surface){
  const rail=surface.querySelector('.freshness-rail[data-fresh]');
  if(!rail)return;
  const visible=Array.from(rail.querySelectorAll('.fresh-row-compact')).filter(chip=>!chip.hidden&&!chip.classList.contains('scan-duplicate'));
  rail.hidden=visible.length===0;
  if(rail.hidden&&rail.contains(document.activeElement))focusFreshnessFallback(surface,document.activeElement);
  if(rail.hidden&&activeFreshPopoverChip&&rail.contains(activeFreshPopoverChip))hideFreshPopover();
  if(!rail.hidden)requestAnimationFrame(()=>updateFreshnessRailOverflow(rail));
  syncCardAttention(surface);
}
function initFreshnessChipScroll(){
  const chevronLeftIcon='<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  const chevronRightIcon='<svg class="ico" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
  const railScrollBehavior=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  function ensurePopover(){
    if(activeFreshPopover)return activeFreshPopover;
    const popover=document.createElement('div');
    popover.id='freshness-fault-tooltip';
    popover.className='fresh-popover';
    popover.dataset.freshPopover='true';
    popover.setAttribute('role','tooltip');
    document.body.appendChild(popover);
    activeFreshPopover=popover;
    return popover;
  }
  function positionPopover(chip,event){
    const popover=ensurePopover();
    const chipRect=chip.getBoundingClientRect();
    const anchorX=Number.isFinite(event?.clientX)?event.clientX:chipRect.right;
    const anchorY=Number.isFinite(event?.clientY)?event.clientY:chipRect.bottom;
    const offset=10;
    const rect=popover.getBoundingClientRect();
    const x=Math.max(12,Math.min(window.innerWidth-rect.width-12,anchorX+offset));
    const y=anchorY+offset+rect.height<=window.innerHeight
      ? anchorY+offset
      : Math.max(12,anchorY-rect.height-offset);
    popover.style.left=x+'px';
    popover.style.top=y+'px';
  }
  function showPopover(chip,event){
    const popover=ensurePopover();
    const label=document.createElement('span');
    label.className='fresh-popover-label';
    label.textContent=chip.dataset.freshLabel||'Host fault';
    const value=document.createElement('span');
    value.className='fresh-popover-value';
    value.textContent=chip.dataset.freshDetail||chip.textContent||'Needs attention';
    popover.replaceChildren(label,value);
    popover.classList.add('visible');
    if(activeFreshPopoverChip&&activeFreshPopoverChip!==chip)activeFreshPopoverChip.removeAttribute('aria-describedby');
    activeFreshPopoverChip=chip;
    chip.setAttribute('aria-describedby',popover.id);
    positionPopover(chip,event);
  }
  document.querySelectorAll('.card .freshness-rail[data-fresh]').forEach(rail=>{
    const chips=Array.from(rail.querySelectorAll('.fresh-row-compact'));
    if(chips.length===0)return;
    const container=document.createElement('div');
    container.className='fresh-scroll-container';
    container.dataset.freshScrollContainer='true';
    chips.forEach(chip=>container.appendChild(chip));
    rail.replaceChildren(container);
    const left=document.createElement('button');
    left.className='fresh-chevron fresh-chevron-left';
    left.innerHTML=chevronLeftIcon;
    left.type='button';
    left.setAttribute('aria-label','Scroll faults left');
    const right=document.createElement('button');
    right.className='fresh-chevron fresh-chevron-right';
    right.innerHTML=chevronRightIcon;
    right.type='button';
    right.setAttribute('aria-label','Scroll faults right');
    left.addEventListener('click',()=>container.scrollBy({left:-160,behavior:railScrollBehavior}));
    right.addEventListener('click',()=>container.scrollBy({left:160,behavior:railScrollBehavior}));
    rail.append(left,right);
    container.addEventListener('wheel',event=>{
      if(container.scrollWidth<=container.clientWidth||Math.abs(event.deltaY)<=Math.abs(event.deltaX)||event.deltaY===0)return;
      const maxScroll=container.scrollWidth-container.clientWidth;
      const canMove=event.deltaY<0?container.scrollLeft>1:container.scrollLeft<maxScroll-1;
      if(!canMove)return;
      event.preventDefault();
      container.scrollLeft+=event.deltaY;
      updateFreshnessRailOverflow(rail);
    },{passive:false});
    container.addEventListener('scroll',()=>{
      if(activeFreshPopoverChip!==document.activeElement)hideFreshPopover();
      updateFreshnessRailOverflow(rail);
    });
    chips.forEach(chip=>{
      chip.dataset.freshLabel=chip.querySelector('.fresh-row-label')?.textContent||'Host fault';
      chip.dataset.freshDetail=chip.querySelector('[data-fresh-value]')?.textContent||'Needs attention';
      chip.removeAttribute('title');
      chip.addEventListener('mouseenter',event=>showPopover(chip,event));
      chip.addEventListener('mousemove',event=>{
        if(activeFreshPopoverChip===chip&&activeFreshPopover?.classList.contains('visible'))positionPopover(chip,event);
      });
      chip.addEventListener('mouseleave',hideFreshPopover);
      chip.addEventListener('focus',()=>showPopover(chip));
      chip.addEventListener('blur',hideFreshPopover);
    });
    if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>updateFreshnessRailOverflow(rail)).observe(rail);
    syncFreshnessRail(rail.closest('[data-host-surface="runtime"]'));
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&activeFreshPopover?.classList.contains('visible'))hideFreshPopover();
  });
}

initFreshnessChipScroll();
