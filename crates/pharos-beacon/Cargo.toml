[package]
name = "pharos-beacon"
description = "Per-host Pharos agent: self-registers and reports status (incl. nix freshness)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pharos-core = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"
url = "2"
# rustls-backed TLS keeps HTTPS available without adding an OpenSSL runtime.
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
