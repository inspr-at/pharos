[package]
name = "pharos-beacon"
description = "Per-host Pharos agent: self-registers and reports status (incl. nix freshness)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pharos-core = { workspace = true }
serde_json = { workspace = true }
# http-only (no TLS): reports to pharosd over the tailnet. Keeps the beacon
# C-free so it builds in the slim image alongside pharosd.
ureq = { version = "2", default-features = false }
