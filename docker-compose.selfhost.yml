# Self-host Pharos control plane template.
#
# This is intentionally separate from docker-compose.yml, which is only for
# local development. Keep runtime values in your shell, host secret manager, or
# orchestrator. Do not commit raw registration tokens or OIDC callback values
# that are tenant-specific.

name: pharos-selfhost

services:
  pharosd:
    image: ghcr.io/inspr-at/pharos/pharosd:${PHAROS_IMAGE_TAG:-0.1.56}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/pharosd", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    environment:
      PHAROS_ADDR: 0.0.0.0:8080
      PHAROS_DB: /data/pharos.json
      RUST_LOG: ${RUST_LOG:-info}

      # Human routes. Pharos uses public-client OIDC with PKCE.
      PHAROS_OIDC_ISSUER: ${PHAROS_OIDC_ISSUER:?set PHAROS_OIDC_ISSUER}
      PHAROS_OIDC_CLIENT_ID: ${PHAROS_OIDC_CLIENT_ID:?set PHAROS_OIDC_CLIENT_ID}
      PHAROS_OIDC_REDIRECT_URI: ${PHAROS_OIDC_REDIRECT_URI:?set PHAROS_OIDC_REDIRECT_URI}
      # Use operator-ref:<sha256>, or email:<address> only when the IdP marks it verified.
      PHAROS_ALLOWED_OPERATORS: ${PHAROS_ALLOWED_OPERATORS:?set PHAROS_ALLOWED_OPERATORS}

      # Machine routes. Local mode requires a runtime registration value;
      # Janus mode requires this to remain unset.
      PHAROS_REGISTRATION_TOKEN: ${PHAROS_REGISTRATION_TOKEN:-}
      PHAROS_REQUIRE_BEACON_TOKEN: "1"
      PHAROS_BEACON_TOKEN_MODE: ${PHAROS_BEACON_TOKEN_MODE:-local}

      # Optional public Janus URL used only to open value-free provider setup.
      # Secret values remain in Janus/agenix and private runtime mounts.
      PHAROS_JANUS_PUBLIC_URL: ${PHAROS_JANUS_PUBLIC_URL:-}

      # Optional existing-host native bootstrap executor. It remains disabled
      # unless every trust/route input is supplied explicitly. Mount the
      # referenced SSH files read-only with a local compose override.
      PHAROS_EXISTING_HOST_EXECUTE: ${PHAROS_EXISTING_HOST_EXECUTE:-0}
      PHAROS_EXISTING_HOST_PHAROS_URL: ${PHAROS_EXISTING_HOST_PHAROS_URL:-}
      PHAROS_EXISTING_HOST_IDENTITY_FILE: ${PHAROS_EXISTING_HOST_IDENTITY_FILE:-}
      PHAROS_EXISTING_HOST_KNOWN_HOSTS_FILE: ${PHAROS_EXISTING_HOST_KNOWN_HOSTS_FILE:-}

      # Optional Hetzner Cloud executor. Keep the API token in a mounted
      # runtime file. The project label is non-secret operator-facing context;
      # the SSH public key and firewall must already exist in that project.
      PHAROS_HCLOUD_EXECUTE: ${PHAROS_HCLOUD_EXECUTE:-0}
      PHAROS_HCLOUD_API_TOKEN_FILE: ${PHAROS_HCLOUD_API_TOKEN_FILE:-}
      PHAROS_HCLOUD_PROJECT_LABEL: ${PHAROS_HCLOUD_PROJECT_LABEL:-}
      PHAROS_HCLOUD_APPROVAL_TTL_SECS: ${PHAROS_HCLOUD_APPROVAL_TTL_SECS:-900}
      PHAROS_HCLOUD_SSH_KEY_REF: ${PHAROS_HCLOUD_SSH_KEY_REF:-}
      PHAROS_HCLOUD_FIREWALL_REF: ${PHAROS_HCLOUD_FIREWALL_REF:-}

      # Optional declared-host manifest paths, for example:
      # PHAROS_MANIFEST_PATHS=/manifests/host-a.json:/manifests/host-b.json
      PHAROS_MANIFEST_PATHS: ${PHAROS_MANIFEST_PATHS:-}
    ports:
      - "${PHAROS_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - pharos_data:/data
      # Optional manifest mount for declared hosts:
      # - ./manifests:/manifests:ro
      # Optional bootstrap SSH mount (use a private local compose override):
      # - ./private/pharos-ssh:/run/pharos/ssh:ro
      # Optional provider token mount (use a private local compose override):
      # - ./private/hcloud-token:/run/pharos/hcloud-token:ro

volumes:
  pharos_data: {}
